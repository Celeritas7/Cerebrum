async function supaGet(path) { const r = await fetch(`${SUPA_URL}/${path}`, { headers: SUPA_HEADERS }); return r.ok ? r.json() : []; }
async function supaPatch(path, body) { return fetch(`${SUPA_URL}/${path}`, { method: "PATCH", headers: {...SUPA_HEADERS, Prefer: "return=representation"}, body: JSON.stringify(body) }); }

// Build app state from Supabase relational tables (first-time bootstrap)
async function buildStateFromDB() {
  const cfgRows = await supaGet("mind_map_app_chat_memory?key=eq.squad_config&select=value");
  if (!cfgRows.length) return null;
  const cfg = JSON.parse(cfgRows[0].value);
  const projIds = Object.values(cfg.projectMap);
  const assemblies = await supaGet(`mind_map_app_assemblies?project_id=in.(${projIds.join(",")})`);
  const asmIds = assemblies.map(a => a.id);
  if (!asmIds.length) return null;
  const tasks = await supaGet(`mind_map_app_tasks?assembly_id=in.(${asmIds.join(",")})&select=*`);
  function buildTree(flat, pid) {
    return flat.filter(t => t.parent_id === pid).map(t => ({
      id: t.id, text: t.name, done: t.status === "done", recurring: t.is_recurring || false,
      children: buildTree(flat, t.id), links: [],
      ...(t.notes === "sleep_tracker" ? { isSleepTracker: true } : {}),
    }));
  }
  const teamOf = {}; projIds.forEach((pid, i) => teamOf[pid] = ["attackers","midPlayers","defenders"][i]);
  const subs = { attackers: [], midPlayers: [], defenders: [] };
  const asmEntries = Object.entries(cfg.assemblyMap);
  for (const a of assemblies) {
    const tk = teamOf[a.project_id]; if (!tk) continue;
    const entry = asmEntries.find(([,v]) => v === a.id);
    const flat = tasks.filter(t => t.assembly_id === a.id);
    subs[tk].push({ id: entry ? entry[0] : a.id, name: a.name, color: subs[tk].length, tasks: buildTree(flat, null), links: [] });
  }
  return { ...DEFAULT_STATE, subteams: subs, credits: cfg.credits || DEFAULT_STATE.credits, coach: cfg.coach || DEFAULT_STATE.coach };
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function generateUUID() { try { return crypto.randomUUID(); } catch { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);}); } }
function isWeekend() { const d = new Date().getDay(); return d === 0 || d === 6; }
function getTodayKey() { return new Date().toISOString().split("T")[0]; }
function getTeamLabel(k) { return k === "attackers" ? "ATTACKERS" : k === "midPlayers" ? "Mid Players" : k === "defenders" ? "Defenders" : "COACH"; }
function getTeamIcon(k) { return k === "attackers" ? "⚔️" : k === "midPlayers" ? "⚡" : k === "defenders" ? "🛡️" : "📋"; }
function isDayTime() { const h = new Date().getHours(); return h >= 6 && h < 18; }
function getWeekDates() {
  const now = new Date(); const day = now.getDay(); const mon = new Date(now);
  mon.setDate(now.getDate() - ((day + 6) % 7));
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    return { key: d.toISOString().split("T")[0], label: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i], date: d.getDate(), isToday: d.toISOString().split("T")[0] === getTodayKey(), isWeekend: i >= 5 };
  });
}

// ─── RECURSIVE TASK TREE HELPERS (stable, outside component) ───
function countAllTasks(tasks) {
  if (!tasks || !Array.isArray(tasks)) return 0;
  let c = 0;
  for (const t of tasks) { c++; if (t.children && t.children.length) c += countAllTasks(t.children); }
  return c;
}
function countDoneTasks(tasks) {
  if (!tasks || !Array.isArray(tasks)) return 0;
  let c = 0;
  for (const t of tasks) { if (t.done) c++; if (t.children && t.children.length) c += countDoneTasks(t.children); }
  return c;
}
function toggleTaskInTree(tasks, tid) {
  if (!tasks) return [];
  return tasks.map(t => {
    if (t.id === tid) return { ...t, done: !t.done };
    if (t.children && t.children.length) return { ...t, children: toggleTaskInTree(t.children, tid) };
    return t;
  });
}
function addChildToTree(tasks, parentId, newTask) {
  if (!tasks) return [];
  return tasks.map(t => {
    if (t.id === parentId) return { ...t, children: [...(t.children || []), newTask] };
    // Recurse even if children is empty array (not just length > 0)
    if (t.children) return { ...t, children: addChildToTree(t.children, parentId, newTask) };
    return t;
  });
}
function removeFromTree(tasks, tid) {
  if (!tasks) return [];
  return tasks.filter(t => t.id !== tid).map(t => {
    if (t.children && t.children.length) return { ...t, children: removeFromTree(t.children, tid) };
    return t;
  });
}
function findInTree(tasks, tid) {
  if (!tasks) return null;
  for (const t of tasks) {
    if (t.id === tid) return t;
    if (t.children && t.children.length) { const f = findInTree(t.children, tid); if (f) return f; }
  }
  return null;
}
function resetTreeRecurring(tasks) {
  if (!tasks) return [];
  return tasks.map(t => ({
    ...t,
    done: t.recurring ? false : t.done,
    children: t.children ? resetTreeRecurring(t.children) : undefined,
  }));
}
// Ensure all attacker tasks have children array (migration helper)
function migrateTasks(tasks) {
  if (!tasks) return [];
  return tasks.map(t => ({
    ...t,
    children: Array.isArray(t.children) ? migrateTasks(t.children) : [],
    links: Array.isArray(t.links) ? t.links : [],
  }));
}
// Add/remove link in task tree
function addLinkInTree(tasks, tid, link) {
  if (!tasks) return [];
  return tasks.map(t => {
    if (t.id === tid) return { ...t, links: [...(t.links || []), link] };
    if (t.children) return { ...t, children: addLinkInTree(t.children, tid, link) };
    return t;
  });
}
function removeLinkInTree(tasks, tid, linkId) {
  if (!tasks) return [];
  return tasks.map(t => {
    if (t.id === tid) return { ...t, links: (t.links || []).filter(l => l.id !== linkId) };
    if (t.children) return { ...t, children: removeLinkInTree(t.children, tid, linkId) };
    return t;
  });
}

// ─── TF-IDF CLASSIFIER + CLAUDE API FALLBACK ───
function tokenize(text) {
  return (text || "").toLowerCase().replace(/[^a-z0-9\u3000-\u9fff\u1000-\u109f]/g, " ").split(/\s+/).filter(w => w.length > 1);
}

function buildTFIDF(subteams, tags) {
  const docs = []; // [{cat, tokens}]
  const df = {};   // word → number of docs containing it
  for (const tk of ["attackers", "midPlayers", "defenders"]) {
    for (const sub of (subteams[tk] || [])) {
      const cat = tk + "::" + sub.id;
      // Sub-team name as a doc (double weight)
      const nameTokens = tokenize(sub.name);
      if (nameTokens.length) { docs.push({ cat, tokens: nameTokens }); docs.push({ cat, tokens: nameTokens }); }
      // Each task text as a doc
      const addTasks = (tasks) => {
        for (const t of (tasks || [])) {
          const tt = tokenize(t.text);
          if (tt.length) docs.push({ cat, tokens: tt });
          if (t.children) addTasks(t.children);
        }
      };
      addTasks(sub.tasks);
      // Tag keywords
      const addTags = (tasks) => {
        for (const t of (tasks || [])) {
          if (t.tagId) {
            const tag = (tags || []).find(g => g.id === t.tagId);
            if (tag && tag.keywords && tag.keywords.length) docs.push({ cat, tokens: tag.keywords.map(k => k.toLowerCase()) });
          }
          if (t.children) addTags(t.children);
        }
      };
      addTags(sub.tasks);
    }
  }
  // Calculate DF (document frequency)
  for (const doc of docs) {
    const seen = new Set(doc.tokens);
    for (const w of seen) df[w] = (df[w] || 0) + 1;
  }
  const N = docs.length || 1;
  // Build per-category TF-IDF vectors
  const catVecs = {}; // cat → {word: tfidf_sum}
  const catDocCount = {};
  for (const doc of docs) {
    const cat = doc.cat;
    if (!catVecs[cat]) catVecs[cat] = {};
    catDocCount[cat] = (catDocCount[cat] || 0) + 1;
    // TF for this doc
    const tf = {};
    for (const w of doc.tokens) tf[w] = (tf[w] || 0) + 1;
    const maxTf = Math.max(...Object.values(tf));
    for (const w of Object.keys(tf)) {
      const tfidf = (tf[w] / maxTf) * Math.log(N / (df[w] || 1));
      catVecs[cat][w] = (catVecs[cat][w] || 0) + tfidf;
    }
  }
  return { catVecs, catDocCount, df, N };
}

function classifyTFIDF(text, model) {
  if (!model || !model.N) return [];
  const tokens = tokenize(text);
  if (!tokens.length) return [];
  // Build query TF-IDF vector
  const qtf = {};
  for (const w of tokens) qtf[w] = (qtf[w] || 0) + 1;
  const qMax = Math.max(...Object.values(qtf));
  const qVec = {};
  for (const w of Object.keys(qtf)) {
    qVec[w] = (qtf[w] / qMax) * Math.log(model.N / (model.df[w] || 1));
  }
  // Cosine similarity with each category
  const results = [];
  for (const cat of Object.keys(model.catVecs)) {
    const cv = model.catVecs[cat];
    let dot = 0, magC = 0, magQ = 0;
    const allWords = new Set([...Object.keys(cv), ...Object.keys(qVec)]);
    for (const w of allWords) {
      const c = cv[w] || 0, q = qVec[w] || 0;
      dot += c * q; magC += c * c; magQ += q * q;
    }
    const sim = (magC && magQ) ? dot / (Math.sqrt(magC) * Math.sqrt(magQ)) : 0;
    const [tk, sid] = cat.split("::");
    results.push({ tk, sid, sim });
  }
  results.sort((a, b) => b.sim - a.sim);
  // Normalize to confidence scores
  const total = results.reduce((a, r) => a + r.sim, 0) || 1;
  return results.map(r => ({ ...r, conf: r.sim / total }));
}

async function classifyClaude(text, subteams) {
  // Build category list for the prompt
  const cats = [];
  for (const tk of ["attackers", "midPlayers", "defenders"]) {
    for (const sub of (subteams[tk] || [])) {
      const sampleTasks = (sub.tasks || []).slice(0, 5).map(t => t.text).join(", ");
      cats.push({ key: tk + "::" + sub.id, name: sub.name, team: tk, samples: sampleTasks });
    }
  }
  const catList = cats.map(c => c.key + " | " + c.name + " (" + c.team + ")" + (c.samples ? " — e.g. " + c.samples : "")).join("\n");
  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 200,
        messages: [{ role: "user", content: "Classify this task into one of these categories. Return ONLY the category key, nothing else.\n\nCategories:\n" + catList + "\n\nTask: \"" + text + "\"\n\nReturn only the key like: attackers::a1" }]
      })
    });
    const data = await resp.json();
    const answer = (data.content || []).map(b => b.text || "").join("").trim();
    const match = answer.match(/^(\w+)::(\w+)$/);
    if (match) return { tk: match[1], sid: match[2], conf: 0.95, source: "claude" };
  } catch (e) { /* API unavailable */ }
  return null;
}

// Auto-tag: scan text against all tag keywords, return best match tag id or null
function autoTagText(text, tags) {
  if (!text || !tags || !tags.length) return null;
  const lower = text.toLowerCase();
  let bestTag = null;
  let bestScore = 0;
  for (const tag of tags) {
    let score = 0;
    for (const kw of (tag.keywords || [])) {
      if (lower.includes(kw.toLowerCase())) score++;
    }
    if (score > bestScore) { bestScore = score; bestTag = tag.id; }
  }
  return bestTag;
}

        if (tLower === lower) score = 100;
        else if (tLower.startsWith(lower)) score = 80;
        else if (tLower.includes(lower)) score = 60;
        else if (lower.split(/\s+/).every(w => tLower.includes(w))) score = 40;

              width:24,height:24,borderRadius:"50%",
              background:`radial-gradient(circle at 35% 35%, ${TC("coach").base}, ${TC("coach").base}cc)`,

                const shade = TC(tk).shades[sub.color % TC(tk).shades.length];

        {/* Task planning panel for selected team */}

          <div style={{marginTop:12,background:T.surface,borderRadius:6,padding:14,border:`1px solid ${TC(fieldSelected).border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>

              <button style={{...btn(fieldSelected,TC(fieldSelected).base),padding:"6px 12px",fontSize:10}}
                onClick={() => {if(editPlanTask.trim()){addWeeklyPlanTask(fieldDay,fieldSelected,editPlanTask.trim());setEditPlanTask("");}}}>

    return (
      <div style={{padding:16,maxWidth:620,margin:"0 auto"}}>
        <div style={{textAlign:"center",padding:"24px 16px 12px"}}>
          <div style={{fontSize:30,marginBottom:10}}>{THEME_LIST.find(t=>t.id===(state.themeId==="auto"?autoTheme:state.themeId))?.icon||"⚽"}</div>
          <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:16,color:T.textSec,fontWeight:500}}>
            {themeMode==="light"?"Time to play. Let's go.":"Night mode. Stay locked in."}
          </div>
        </div>
        {fullLocked && (
          <div style={{background:T.lockBg,border:`2px solid ${T.lockBrd}`,borderRadius:8,padding:24,marginBottom:20,textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:8}}>🚨</div>
            <div style={{fontFamily:P_ALL.coach.font,fontSize:18,fontWeight:700,color:T.lockBrd,letterSpacing:4,marginBottom:8}}>FULL TEAM LOCKDOWN</div>
            <div style={{fontFamily:P_ALL.coach.font,fontSize:13,color:T.textSec,marginBottom:16}}>TRIGGERED BY: {getTeamLabel(state.lockdown.triggeredBy)}</div>

        )}
        <div style={{background:T.cardBg,border:`1px solid ${T.border}`,borderRadius:12,padding:18,marginBottom:20,boxShadow:T.shadow}}>
          <div style={{fontFamily:P_ALL.coach.font,fontSize:12,letterSpacing:4,color:T.textMut,marginBottom:14}}>SCOREBOARD — {wknd?"⚠️ WEEKEND [STRICT]":"WEEKDAY [FLUID]"}</div>
          <div style={{display:"flex",gap:8}}>
            {["attackers","midPlayers","defenders"].map(tk => {
              const comp=getComp(tk);const min=getMin(tk);const met=comp>=min;const P=P_ALL[tk];const C=TC(tk);
              return (<div key={tk} style={{flex:1,background:C.lighter,padding:14,textAlign:"center",border:`${P.borderWidth}px solid ${met?T.ok+"30":C.border}`,borderRadius:P.cardRadius}}>
                <div style={{fontSize:20,marginBottom:6}}>{getTeamIcon(tk)}</div>
                <div style={{fontFamily:P.font,...P.labelStyle,color:T.textMut,marginBottom:8,fontSize:8}}>{P.nameDisplay}</div>
                <div style={{fontFamily:P.font,fontSize:tk==="defenders"?22:28,fontWeight:700,color:C.base}}>{state.credits[tk]}</div>
                <div style={{fontFamily:P.bodyFont,fontSize:9,color:T.textMut,letterSpacing:2,marginTop:2}}>PTS</div>
                <div style={{marginTop:8,fontFamily:P.bodyFont,fontSize:11,fontWeight:600,color:met?T.ok:T.warn}}>{comp}/{min}</div>
              </div>);
            })}
          </div>
        </div>
        {["attackers","midPlayers","defenders"].map(tk => {
          const lk=isLkd(tk);const P=P_ALL[tk];const C=TC(tk);
          const fp = (state.fieldPlayers||{})[tk] || [];
          const hasFocus = fp.length > 0;
          const focusedSubs = hasFocus ? state.subteams[tk].filter(s => fp.includes(s.id)) : state.subteams[tk];
          const allSubs = state.subteams[tk];
          const total=focusedSubs.reduce((a,s)=>{const fIds=((state.focusedTasks||{})[s.id]||[]);const vis=fIds.length>0?s.tasks.filter(t=>fIds.includes(t.id)):s.tasks;return a+countAllTasks(vis);},0);
          const done=focusedSubs.reduce((a,s)=>{const fIds=((state.focusedTasks||{})[s.id]||[]);const vis=fIds.length>0?s.tasks.filter(t=>fIds.includes(t.id)):s.tasks;return a+countDoneTasks(vis);},0);
          const allTotal=allSubs.reduce((a,s)=>a+countAllTasks(s.tasks),0);
          const allDone=allSubs.reduce((a,s)=>a+countDoneTasks(s.tasks),0);
          return (<div key={tk} style={{background:C.card,borderRadius:P.cardRadius,border:`${P.borderWidth}px solid ${C.border}`,borderLeft:`${P.borderWidth+2}px solid ${C.base}`,padding:18,marginBottom:14,opacity:lk?0.3:1,transition:"all 0.3s",boxShadow:T.shadow}}>            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{flex:1}}>

                  {hasFocus&&<span style={{background:TC("coach").base,color:"#fff",padding:"2px 8px",borderRadius:10,fontSize:8,letterSpacing:1,fontFamily:P_ALL.coach.font}}>🎯 FOCUSED</span>}
                </div>
                <div style={{fontFamily:P.bodyFont,fontSize:11,color:T.textMut}}>{P.tagline}</div>
              </div>
              <div style={{background:C.badge,color:"#fff",padding:"6px 14px",borderRadius:P.btnStyle.borderRadius,fontFamily:P.font,fontSize:13,fontWeight:700}}>{state.credits[tk]}</div>
            </div>
            {/* Focused sub-team pills */}
            {hasFocus && (
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:10}}>
                {focusedSubs.map(sub => {
                  const shade = C.shades[sub.color % C.shades.length];
                  const subFocusIds = (state.focusedTasks||{})[sub.id]||[];
                  const hasSubFocus = subFocusIds.length > 0;
                  const visTasks = hasSubFocus ? sub.tasks.filter(t => subFocusIds.includes(t.id)) : sub.tasks;
                  const subDone = countDoneTasks(visTasks);
                  const subTotal = countAllTasks(visTasks);
                  return (
                    <div key={sub.id} style={{
                      display:"flex",alignItems:"center",gap:4,
                      background:shade+"18",border:`1px solid ${shade}35`,
                      borderRadius:14,padding:"3px 10px 3px 6px",
                    }}>
                      <div style={{width:14,height:14,borderRadius:"50%",background:shade,display:"flex",alignItems:"center",justifyContent:"center"}}>

              }

            {/* Inline focused tasks — work from home */}
            {hasFocus && (
              <div style={{marginTop:12,borderTop:`1px solid ${C.border}`,paddingTop:10}}>
                {focusedSubs.map(sub => {
                  const shade = C.shades[sub.color % C.shades.length];

                  const subFocusIds = (state.focusedTasks||{})[sub.id]||[];

                  const visibleTasks = hasTaskFocus ? sub.tasks.filter(t => subFocusIds.includes(t.id)) : sub.tasks;
                  const subTaskCount = countAllTasks(visibleTasks);
                  if (subTaskCount === 0) return null;

                  // Compact recursive renderer for dashboard (all teams)
                  const renderDashTask = (task, depth = 0) => {
                    const hasKids = task.children?.length > 0;
                    const taskLinks = task.links || [];
                    const dColor = C.shades[(sub.color + depth) % C.shades.length];
                    const dTag = task.tagId ? (state.tags||[]).find(t=>t.id===task.tagId) : null;
                    if (task.isSleepTracker) {
                      return (
                        <div key={task.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",paddingLeft:depth*16,flexWrap:"wrap"}}>
                          <span style={{fontFamily:P.bodyFont,fontSize:12,opacity:task.done?0.35:1,color:T.text,textDecoration:task.done?"line-through":"none",flex:1}}>
                            {tk==="defenders"?"🔒":"🌙"} {task.text} {task.sleepHours?`(${task.sleepHours}H)`:""}
                          </span>
                          {!task.done?(
                            <div style={{display:"flex",gap:4,alignItems:"center"}}>
                              <input type="number" placeholder="HRS" value={sleepHours} onChange={e=>setSleepHours(e.target.value)} style={{...inp(tk),width:50,padding:"4px 6px",textAlign:"center",fontSize:11}} min="0" max="24" step="0.5"/>
                              <button style={{...btn(tk,shade),padding:"4px 10px",fontSize:9}} onClick={()=>{if(sleepHours){completeTask(tk,sub.id,task.id,sleepHours);setSleepHours("");}}}>{tk==="defenders"?"LOCK":"LOG"}</button>
                            </div>
                          ):(<button style={{...btn(tk,"transparent"),opacity:0.4,fontSize:8,color:T.textSec,padding:"2px 6px"}} onClick={()=>completeTask(tk,sub.id,task.id)}>UNDO</button>)}
                        </div>
                      );
                    }
                    return (
                      <div key={task.id}>
                        <div style={{display:"flex",alignItems:"center",gap:5,padding:"4px 0",paddingLeft:depth*16}}>
                          {depth > 0 && <div style={{width:8,height:8,borderLeft:`1.5px solid ${dColor}40`,borderBottom:`1.5px solid ${dColor}40`,borderRadius:"0 0 0 3px",flexShrink:0,marginLeft:-6}} />}
                          {hasKids && (
                            <button onClick={(e)=>{e.stopPropagation();toggleCollapse(task.id);}} style={{
                              background:"transparent",border:"none",cursor:"pointer",padding:0,
                              fontSize:Math.max(7,10-depth),color:dColor,flexShrink:0,width:14,height:14,
                              display:"flex",alignItems:"center",justifyContent:"center",opacity:0.6,
                              transition:"transform 0.2s",transform:collapsedTasks.has(task.id)?"rotate(-90deg)":"rotate(0deg)",
                            }}>▼</button>
                          )}
                          <div onClick={()=>completeTask(tk,sub.id,task.id)} style={{
                            width:Math.max(14,18-depth*2),height:Math.max(14,18-depth*2),
                            borderRadius:P.checkRadius,border:`2px solid ${task.done?dColor:T.chkOff}`,
                            background:task.done?dColor:"transparent",cursor:"pointer",
                            display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,
                          }}>
                            {task.done&&<span style={{color:"#fff",fontSize:Math.max(7,9-depth),fontWeight:700}}>{tk==="attackers"?"✕":tk==="defenders"?"🔒":"✓"}</span>}
                          </div>
                          {dTag && <span style={{background:dTag.color+"20",color:dTag.color,padding:"0px 5px",borderRadius:8,fontSize:6,fontFamily:P_ALL.coach.font,fontWeight:700,letterSpacing:0.5,flexShrink:0}}>{dTag.name}</span>}
                          <span style={{fontFamily:P.bodyFont,fontSize:Math.max(10,12-depth),opacity:task.done?0.3:1,color:T.text,textDecoration:task.done?"line-through":"none",flex:1}}>{task.text}</span>
                          {taskLinks.length > 0 && <span style={{fontSize:7,color:dColor,opacity:0.6}}>🔗{taskLinks.length}</span>}
                          {hasKids && <span style={{fontSize:7,color:dColor,fontFamily:P_ALL.coach.font}}>{countDoneTasks(task.children)}/{countAllTasks(task.children)}</span>}
                        </div>
                        {/* Compact links */}
                        {taskLinks.length > 0 && (
                          <div style={{display:"flex",flexWrap:"wrap",gap:3,paddingLeft:depth*16+(depth>0?14:22),paddingBottom:2}}>
                            {taskLinks.map(link => (
                              <a key={link.id} href={link.url} target="_blank" rel="noopener noreferrer" style={{
                                background:dColor+"10",border:`1px solid ${dColor}25`,
                                color:dColor,padding:"1px 7px",borderRadius:10,
                                fontSize:8,textDecoration:"none",fontFamily:P.font,letterSpacing:1,
                              }}>⚡ {link.title}</a>
                            ))}
                          </div>
                        )}
                        {hasKids && !collapsedTasks.has(task.id) && task.children.map(c => renderDashTask(c, depth+1))}
                      </div>
                    );
                  };

                  return (
                    <div key={sub.id} style={{marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                        <span style={{fontFamily:P.font,...P.labelStyle,fontSize:8,color:shade}}>{sub.name}</span>
                        {hasTaskFocus && <span style={{fontSize:7,color:TC("coach").base,fontFamily:P_ALL.coach.font,letterSpacing:1}}>🎯 {subFocusIds.length}/{sub.tasks.length}</span>}
                      </div>
                      {visibleTasks.map(task => renderDashTask(task, 0))}
                    </div>
                  );
                })}
                <div style={{fontFamily:P_ALL.coach.font,fontSize:8,color:T.textMut,letterSpacing:2,marginTop:4,textAlign:"center",opacity:0.5}}>
                  📋 COACH FOCUSED VIEW · USE NAV BAR FOR FULL ACCESS
                </div>
              </div>
            )}
          </div>);
        })}
        <div style={{background:TC("coach").card,borderRadius:P_ALL.coach.cardRadius,border:`1px solid ${TC("coach").border}`,borderLeft:`3px solid ${TC("coach").base}`,padding:18,cursor:"pointer",boxShadow:T.shadow}} onClick={()=>setView("coach")}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22}}>📋</span>
            <div><div style={{fontFamily:P_ALL.coach.font,...P_ALL.coach.titleStyle,fontSize:18,color:TC("coach").base}}>COACH</div>
            <div style={{fontFamily:P_ALL.coach.bodyFont,fontSize:11,color:T.textMut,letterSpacing:2}}>{P_ALL.coach.tagline}</div></div>
          </div>
        </div>
      </div>
    );
  };

  /* ─── TEAM VIEW ─── */
  const renderTeam = () => {
    if (!selectedTeam) return null; const tk=selectedTeam;const P=P_ALL[tk];const C=TC(tk);
    return (
      <div style={{padding:16,maxWidth:620,margin:"0 auto"}}>
        <div style={{background:C.card,border:`${P.borderWidth}px solid ${C.border}`,borderRadius:P.cardRadius,padding:20,marginBottom:18,boxShadow:T.shadow}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontFamily:P.font,...P.labelStyle,color:T.textMut,marginBottom:6}}>{tk==="attackers"?"ASSAULT TEAM":tk==="defenders"?"DEFENSE SECTOR":"TEAM"}</div>
              <div style={{fontFamily:P.font,...P.titleStyle,fontSize:tk==="defenders"?20:24,color:C.base}}>{getTeamIcon(tk)} {P.nameDisplay}</div>
              <div style={{fontFamily:P.bodyFont,fontSize:11,color:T.textMut,marginTop:6}}>{P.tagline}</div></div>
            <div style={{textAlign:"right"}}><div style={{fontFamily:P.font,fontSize:34,fontWeight:700,color:C.base}}>{state.credits[tk]}</div>
              <div style={{fontFamily:P.bodyFont,...P.labelStyle,color:T.textMut}}>{tk==="defenders"?"SHIELD PTS":tk==="attackers"?"STRIKE PTS":"CREDITS"}</div></div>
          </div>
        </div>
        <div style={{background:T.cardBg,borderRadius:P.cardRadius,padding:12,marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",border:`${P.borderWidth}px solid ${T.border}`,boxShadow:T.shadow}}>
          <span style={{fontFamily:P.bodyFont,...P.labelStyle,color:T.textSec,fontSize:10}}>{isWeekend()?(tk==="defenders"?"⚠️ WEEKEND — ALL SHIELDS UP":tk==="attackers"?"⚠️ WEEKEND — STAND DOWN":"Weekend — strict"):(tk==="defenders"?"WEEKDAY — MAINTAIN PERIMETER":tk==="attackers"?"WEEKDAY — ENGAGE":"Weekday — fluid")}</span>
          <span style={{fontFamily:P.font,fontSize:14,fontWeight:700,color:getComp(tk)>=getMin(tk)?T.ok:T.warn}}>{getComp(tk)}/{getMin(tk)}</span>
        </div>
        {state.subteams[tk].map(sub => {
          const shade=C.shades[sub.color%C.shades.length];
          const taskTotal = countAllTasks(sub.tasks);
          const taskDone = countDoneTasks(sub.tasks);

          // Recursive attacker task renderer
          const renderAttackerTask = (task, depth = 0) => {
            const hasChildren = task.children?.length > 0;
            const hasLinks = (task.links || []).length > 0;
            const childDone = hasChildren ? countDoneTasks(task.children) : 0;
            const childTotal = hasChildren ? countAllTasks(task.children) : 0;
            const depthColors = [shade, C.shades[(sub.color+1)%C.shades.length], C.shades[(sub.color+2)%C.shades.length], C.shades[(sub.color+3)%C.shades.length]];
            const dColor = depthColors[Math.min(depth, depthColors.length-1)];
            const isAddingHere = addSubTo?.subId===sub.id && addSubTo?.parentId===task.id;
            const isAddingLink = addLinkTo?.subId===sub.id && addLinkTo?.taskId===task.id;
            const isPickingTag = tagPicker?.subId===sub.id && tagPicker?.taskId===task.id;
            const taskTag = task.tagId ? (state.tags||[]).find(t=>t.id===task.tagId) : null;
            const checkSymbol = tk==="attackers"?"✕":tk==="defenders"?"🔒":"✓";
            // Sleep tracker special case
            if (task.isSleepTracker) {
              return (
                <div key={task.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",paddingLeft:depth*20,borderBottom:`1px solid ${T.border}`,flexWrap:"wrap"}}>
                  <span style={{fontFamily:P.bodyFont,...P.taskStyle,opacity:task.done?0.35:1,color:T.text,textDecoration:task.done?"line-through":"none",flex:1}}>{tk==="defenders"?"🔒":"🌙"} {task.text} {task.sleepHours?`(${task.sleepHours}H)`:""}</span>
                  {!task.done?(
                    <div style={{display:"flex",gap:4,alignItems:"center"}}>
                      <input type="number" placeholder="HRS" value={sleepHours} onChange={e=>setSleepHours(e.target.value)} style={{...inp(tk),width:55,padding:"5px 8px",textAlign:"center"}} min="0" max="24" step="0.5"/>
                      <button style={btn(tk,shade)} onClick={()=>{if(sleepHours){completeTask(tk,sub.id,task.id,sleepHours);setSleepHours("");}}}>{tk==="defenders"?"LOCK":"LOG"}</button>
                    </div>
                  ):(<button style={{...btn(tk,"transparent"),opacity:0.4,fontSize:9,color:T.textSec}} onClick={()=>completeTask(tk,sub.id,task.id)}>UNDO</button>)}
                </div>
              );
            }
            return (
              <div key={task.id}>
                <div style={{
                  display:"flex", alignItems:"center", gap:6, padding:"8px 0",
                  paddingLeft: depth * 20,
                  borderBottom:`1px solid ${T.border}`,
                }}>
                  {depth > 0 && (
                    <div style={{width:12,height:12,borderLeft:`2px solid ${dColor}40`,borderBottom:`2px solid ${dColor}40`,borderRadius:"0 0 0 4px",flexShrink:0,marginLeft:-10}} />
                  )}
                  {hasChildren && (
                    <button onClick={(e)=>{e.stopPropagation();toggleCollapse(task.id);}} style={{
                      background:"transparent",border:"none",cursor:"pointer",padding:0,
                      fontSize:Math.max(8,12-depth),color:dColor,flexShrink:0,width:16,height:16,
                      display:"flex",alignItems:"center",justifyContent:"center",opacity:0.7,
                      transition:"transform 0.2s",transform:collapsedTasks.has(task.id)?"rotate(-90deg)":"rotate(0deg)",
                    }} title={collapsedTasks.has(task.id)?"Expand":"Collapse"}>▼</button>
                  )}
                  <div onClick={()=>completeTask(tk,sub.id,task.id)} style={{
                    width: Math.max(16, 22 - depth*2), height: Math.max(16, 22 - depth*2),
                    borderRadius:P.checkRadius, border:`2px solid ${task.done?dColor:T.chkOff}`,
                    background:task.done?dColor:"transparent", cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,
                  }}>
                    {task.done&&<span style={{color:"#fff",fontSize:Math.max(8,11-depth),fontWeight:700}}>{checkSymbol}</span>}
                  </div>
                  {/* Tag pill */}
                  {taskTag && (
                    <button onClick={(e)=>{e.stopPropagation();setTagPicker(isPickingTag?null:{subId:sub.id,taskId:task.id});}} style={{
                      background:taskTag.color+"20",border:`1.5px solid ${taskTag.color}50`,
                      color:taskTag.color,padding:"1px 7px",borderRadius:10,
                      fontSize:7,fontFamily:P_ALL.coach.font,fontWeight:700,letterSpacing:1,
                      cursor:"pointer",flexShrink:0,whiteSpace:"nowrap",
                    }}>{taskTag.name}</button>
                  )}
                  {!taskTag && (
                    <button onClick={(e)=>{e.stopPropagation();setTagPicker(isPickingTag?null:{subId:sub.id,taskId:task.id});}} style={{
                      background:"transparent",border:`1.5px dashed ${T.borderStr}`,
                      color:T.textMut,padding:"1px 6px",borderRadius:10,
                      fontSize:7,fontFamily:P_ALL.coach.font,cursor:"pointer",flexShrink:0,opacity:0.5,
                    }}>TAG</button>
                  )}
                  <span style={{
                    fontFamily:P.bodyFont,...P.taskStyle,
                    fontSize: Math.max(10, 14 - depth), opacity:task.done?0.3:1,
                    color:T.text, textDecoration:task.done?"line-through":"none", flex:1,
                  }}>
                    {task.text}
                  </span>
                  {hasLinks && (
                    <span style={{fontSize:8,color:dColor,fontFamily:P_ALL.coach.font,opacity:0.7}}>🔗{task.links.length}</span>
                  )}
                  {hasChildren && (
                    <span style={{
                      background:dColor+"18", color:dColor, padding:"1px 6px",
                      borderRadius:8, fontSize:8, fontFamily:P_ALL.coach.font, fontWeight:700,
                    }}>
                      {childDone}/{childTotal}
                    </span>
                  )}
                  {depth === 0 && task.recurring && (
                    <span style={{fontFamily:P.bodyFont,...P.labelStyle,fontSize:8,color:T.textMut}}>REPEAT</span>
                  )}
                  <button onClick={(e)=>{e.stopPropagation();setAddLinkTo({subId:sub.id,taskId:task.id});setTaskLinkTitle("");setTaskLinkUrl("");setAddSubTo(null);setTagPicker(null);}} style={{
                    background:isAddingLink ? dColor : "transparent",
                    border:`1.5px solid ${dColor}60`,
                    color:isAddingLink ? "#fff" : dColor,
                    cursor:"pointer", fontSize:8, fontWeight:700,
                    borderRadius:4, width:22, height:22,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    flexShrink:0, transition:"all 0.15s", opacity:isAddingLink?1:0.6,
                  }} title="Add link">🔗</button>
                  <button onClick={(e)=>{e.stopPropagation();setAddSubTo({subId:sub.id,parentId:task.id});setSubTaskText("");setShowAddTask(false);setAddLinkTo(null);setTagPicker(null);}} style={{
                    background:isAddingHere ? dColor : dColor+"20",
                    border:`1.5px solid ${dColor}`,
                    color:isAddingHere ? "#fff" : dColor,
                    cursor:"pointer", fontSize:10, fontWeight:700,
                    borderRadius:4, width:22, height:22,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    flexShrink:0, transition:"all 0.15s",
                  }} title="Add sub-target">+</button>
                  <button onClick={()=>removeTask(tk,sub.id,task.id)} style={{background:"transparent",border:"none",color:T.rmBtn,cursor:"pointer",fontSize:14,padding:"0 4px"}}>×</button>
                </div>
                {/* Tag picker */}
                {isPickingTag && (
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,padding:"6px 0 6px "+(depth*20+(depth>0?14:0))+"px",paddingLeft:depth*20+(depth>0?14:0),background:T.surface,borderRadius:4,margin:"2px 0"}}>
                    <button onClick={()=>{setTaskTag(sub.id,task.id,null);setTagPicker(null);}} style={{
                      background:!task.tagId?"#fff":"transparent",border:`1.5px solid ${T.borderStr}`,
                      color:T.textMut,padding:"2px 8px",borderRadius:10,fontSize:7,fontFamily:P_ALL.coach.font,cursor:"pointer",
                    }}>NONE</button>
                    {(state.tags||[]).map(tag => (
                      <button key={tag.id} onClick={()=>{setTaskTag(sub.id,task.id,tag.id);setTagPicker(null);}} style={{
                        background:task.tagId===tag.id?tag.color:tag.color+"20",
                        border:`1.5px solid ${tag.color}`,
                        color:task.tagId===tag.id?"#fff":tag.color,
                        padding:"2px 8px",borderRadius:10,fontSize:7,
                        fontFamily:P_ALL.coach.font,fontWeight:700,letterSpacing:1,cursor:"pointer",
                      }}>{tag.name}</button>
                    ))}
                    <button onClick={()=>setTagPicker(null)} style={{background:"transparent",border:"none",color:T.textSec,cursor:"pointer",fontSize:12}}>✕</button>
                  </div>
                )}
                {/* Task links */}
                {hasLinks && (
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,paddingLeft:depth*20+(depth>0?14:0),padding:"4px 0 4px "+(depth*20+(depth>0?14:0))+"px"}}>
                    {task.links.map(link => (
                      <div key={link.id} style={{display:"flex",alignItems:"center",gap:0}}>
                        <a href={link.url} target="_blank" rel="noopener noreferrer" style={{
                          background:dColor+(themeMode==="light"?"10":"14"),
                          border:`1.5px solid ${dColor}30`,
                          color:dColor,padding:"3px 8px",
                          borderRadius:`${P.btnStyle.borderRadius}px 0 0 ${P.btnStyle.borderRadius}px`,
                          fontSize:9,textDecoration:"none",fontFamily:P.font,letterSpacing:1,
                          display:"flex",alignItems:"center",gap:4,
                        }}>
                          <span style={{fontSize:8}}>⚡</span> {link.title}
                        </a>
                        <button onClick={()=>removeTaskLink(sub.id,task.id,link.id)} style={{
                          background:dColor+(themeMode==="light"?"10":"14"),
                          border:`1.5px solid ${dColor}30`,borderLeft:"none",
                          color:T.rmBtn,cursor:"pointer",fontSize:10,
                          padding:"3px 5px",
                          borderRadius:`0 ${P.btnStyle.borderRadius}px ${P.btnStyle.borderRadius}px 0`,
                        }}>×</button>
                      </div>
                    ))}
                  </div>
                )}
                {/* Add link input */}
                {isAddingLink && (
                  <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",paddingLeft:depth*20+(depth>0?14:0),padding:"6px 0 6px "+(depth*20+(depth>0?14:0))+"px"}}>
                    <input style={{...inp(tk),width:90,fontSize:10,padding:"5px 8px"}} placeholder="TITLE" value={taskLinkTitle} onChange={e=>setTaskLinkTitle(e.target.value)} autoFocus />
                    <input style={{...inp(tk),flex:1,minWidth:100,fontSize:10,padding:"5px 8px"}} placeholder="URL" value={taskLinkUrl} onChange={e=>setTaskLinkUrl(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"&&taskLinkTitle.trim()&&taskLinkUrl.trim()){addTaskLink(sub.id,task.id,taskLinkTitle.trim(),taskLinkUrl.trim());setTaskLinkTitle("");setTaskLinkUrl("");setAddLinkTo(null);}if(e.key==="Escape"){setAddLinkTo(null);}}} />
                    <button style={{...btn(tk,dColor),padding:"4px 10px",fontSize:9}} onClick={()=>{if(taskLinkTitle.trim()&&taskLinkUrl.trim()){addTaskLink(sub.id,task.id,taskLinkTitle.trim(),taskLinkUrl.trim());setTaskLinkTitle("");setTaskLinkUrl("");setAddLinkTo(null);}}}>🔗 LINK</button>
                    <button style={{background:"transparent",border:"none",color:T.textSec,cursor:"pointer",fontSize:14,fontWeight:700}} onClick={()=>setAddLinkTo(null)}>✕</button>
                  </div>
                )}
                {/* Sub-task input inline */}
                {isAddingHere && (
                  <div style={{display:"flex",gap:6,alignItems:"center",paddingLeft:(depth+1)*20+12,padding:"8px 0 8px "+((depth+1)*20+12)+"px"}}>
                    <div style={{width:12,height:12,borderLeft:`2px solid ${dColor}40`,borderBottom:`2px solid ${dColor}40`,borderRadius:"0 0 0 4px",flexShrink:0}} />
                    <input style={{...inp(tk),flex:1,fontSize:11,padding:"6px 10px"}} placeholder={`SUB-TARGET UNDER "${task.text}"...`} value={subTaskText} onChange={e=>setSubTaskText(e.target.value)} autoFocus
                      onKeyDown={e=>{if(e.key==="Enter"&&subTaskText.trim()){addTask(tk,sub.id,subTaskText.trim(),task.id);setSubTaskText("");setAddSubTo(null);}if(e.key==="Escape"){setAddSubTo(null);setSubTaskText("");}}} />
                    <button style={{...btn(tk,dColor),padding:"5px 12px",fontSize:10}} onClick={()=>{if(subTaskText.trim()){addTask(tk,sub.id,subTaskText.trim(),task.id);setSubTaskText("");setAddSubTo(null);}}}>DEPLOY</button>
                    <button style={{background:"transparent",border:"none",color:T.textSec,cursor:"pointer",fontSize:14,fontWeight:700}} onClick={()=>{setAddSubTo(null);setSubTaskText("");}}>✕</button>
                  </div>
                )}
                {hasChildren && !collapsedTasks.has(task.id) && task.children.map(child => renderAttackerTask(child, depth + 1))}
              </div>
            );
          };

          return (<div key={sub.id} style={{background:T.cardBg,border:`${P.borderWidth}px solid ${shade}${themeMode==="light"?"20":"25"}`,borderLeft:`${P.borderWidth+2}px solid ${shade}`,borderRadius:P.cardRadius,padding:16,marginBottom:14,boxShadow:T.shadow}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={{fontFamily:P.font,...P.titleStyle,fontSize:13,color:shade}}>{sub.name}</span>
              <span style={{background:shade+(themeMode==="light"?"12":"18"),color:shade,padding:"3px 10px",borderRadius:P.btnStyle.borderRadius,fontSize:10,fontFamily:P.bodyFont,fontWeight:600}}>{taskDone}/{taskTotal}</span>
              <button onClick={()=>collapseAll(sub.tasks)} title="Collapse all" style={{background:"transparent",border:`1px solid ${shade}30`,color:shade,cursor:"pointer",fontSize:9,padding:"2px 6px",borderRadius:4,opacity:0.6}}>▲</button>
              <button onClick={()=>expandAll(sub.tasks)} title="Expand all" style={{background:"transparent",border:`1px solid ${shade}30`,color:shade,cursor:"pointer",fontSize:9,padding:"2px 6px",borderRadius:4,opacity:0.6}}>▼</button>
            </div>
            {/* Focus filter pills — all teams */}
            {sub.tasks.length > 0 && (
              <div style={{marginBottom:12,padding:10,background:T.surface,borderRadius:6,border:`1px solid ${T.border}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontFamily:P.font,...P.labelStyle,fontSize:8,color:T.textMut,letterSpacing:2}}>🎯 FOCUS TARGETS — HOME PRIORITY</span>
                  {((state.focusedTasks||{})[sub.id]||[]).length > 0 && (
                    <button onClick={()=>clearFocusedTasks(sub.id)} style={{background:"transparent",border:`1px solid ${T.border}`,color:T.textMut,cursor:"pointer",fontSize:7,padding:"2px 8px",borderRadius:4,fontFamily:P_ALL.coach.font,letterSpacing:1}}>CLEAR ALL</button>
                  )}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {sub.tasks.map(task => {
                    const isFocused = ((state.focusedTasks||{})[sub.id]||[]).includes(task.id);
                    const tDone = task.done;
                    const childCount = countAllTasks(task.children || []);
                    const childDoneCount = countDoneTasks(task.children || []);
                    return (
                      <button key={task.id} onClick={()=>toggleFocusedTask(sub.id, task.id)} style={{
                        display:"flex",alignItems:"center",gap:5,
                        background: isFocused ? shade : T.cardBg,
                        border: `2px solid ${isFocused ? shade : T.borderStr}`,
                        borderRadius:16,padding:"5px 12px 5px 8px",cursor:"pointer",
                        transition:"all 0.2s",opacity:tDone?0.5:1,

                            display:"flex",alignItems:"center",gap:10,padding:"10px 14px",
                            background:i===0?teamCol+"12":"transparent",
                            border:"1.5px solid "+(i===0?teamCol+"40":T.border),
                            borderRadius:10,cursor:"pointer",width:"100%",textAlign:"left",
                            transition:"all 0.15s",
                          }}>
                            {/* Circular confidence */}
                            <div style={{position:"relative",width:34,height:34,flexShrink:0}}>
                              <svg width="34" height="34" viewBox="0 0 34 34">
                                <circle cx="17" cy="17" r="14" fill="none" stroke={teamCol+"20"} strokeWidth="2.5" />
                                <circle cx="17" cy="17" r="14" fill="none" stroke={teamCol} strokeWidth="2.5"
                                  strokeDasharray={87.96} strokeDashoffset={87.96*(1-conf/100)}
                                  strokeLinecap="round" transform="rotate(-90 17 17)"
                                  style={{transition:"stroke-dashoffset 0.5s ease"}} />
                              </svg>
                              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700,color:teamCol,fontFamily:P.font}}>{conf}</div>
                            </div>
                            <div style={{flex:1}}>
                              <div style={{fontSize:11,color:T.text,fontWeight:600}}>{getTeamIcon(s.tk)} {sub?.name || s.sid}</div>
                              <div style={{fontSize:8,color:T.textMut,letterSpacing:1,marginTop:1}}>{getTeamLabel(s.tk)}</div>
                            </div>
                            {i===0 && <div style={{fontSize:7,fontWeight:700,letterSpacing:2,color:teamCol,background:teamCol+"12",padding:"3px 8px",borderRadius:20,fontFamily:P.font}}>BEST</div>}
                          </button>
                        );
                      })}
                    </div>
                  )}

                  {/* Manual pick */}
                  {d.type === "manual" && (
                    <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:4}}>
                      {["attackers","midPlayers","defenders"].map(tk =>
                        (state.subteams[tk]||[]).map(sub => (
                          <button key={sub.id} onClick={() => confirmChatRoute(tk, sub.id, d.taskText)} style={{
                            display:"flex",alignItems:"center",gap:8,padding:"8px 12px",
                            background:"transparent",border:"1px solid "+T.border,
                            borderRadius:8,cursor:"pointer",width:"100%",textAlign:"left",
                            transition:"all 0.15s",
                          }}>
                            <div style={{width:10,height:10,borderRadius:"50%",background:TC(tk).base}} />
                            <span style={{fontSize:11,color:T.text}}>{sub.name}</span>
                            <span style={{fontSize:8,color:TC(tk).base,letterSpacing:1,marginLeft:"auto",fontFamily:P.font}}>{getTeamLabel(tk)}</span>
                          </button>
                        ))
                      )}
                    </div>
                  )}

                  {/* Search results — links mode */}
                  {d.type === "search_links" && d.results && (
                    <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
                      {d.results.map((r, i) => {
                        const C = TC(r.tk);
                        const shade = C.shades ? C.shades[r.sub.color % C.shades.length] : C.base;
                        const taskLinks = r.task.links || [];
                        const childLinks = [];
                        const collectLinks = (tasks) => tasks.forEach(t => { (t.links||[]).forEach(l => childLinks.push({...l, from: t.text})); if (t.children) collectLinks(t.children); });
                        if (r.task.children) collectLinks(r.task.children);
                        const allLinks = [...taskLinks.map(l => ({...l, from: r.task.text})), ...childLinks];
                        return (
                          <div key={i} style={{background:shade+"08",border:`1.5px solid ${shade}25`,borderLeft:`3px solid ${shade}`,borderRadius:8,padding:10}}>
                            <div style={{fontSize:11,fontWeight:700,color:T.text,marginBottom:6}}>{r.task.text}</div>
                            {allLinks.length > 0 ? (
                              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                                {allLinks.map((link, li) => (
                                  <a key={li} href={link.url} target="_blank" rel="noopener noreferrer" style={{
                                    background:shade+"12",border:`1px solid ${shade}30`,
                                    color:shade,padding:"4px 10px",borderRadius:12,
                                    fontSize:9,textDecoration:"none",fontFamily:P_ALL.coach.font,
                                    display:"flex",alignItems:"center",gap:4,
                                  }}>
                                    <span style={{fontSize:8}}>⚡</span> {link.title}
                                    {link.from !== r.task.text && <span style={{fontSize:7,opacity:0.6}}>({link.from})</span>}
                                  </a>
                                ))}
                              </div>
                            ) : (
                              <div style={{fontSize:9,color:T.textMut,opacity:0.5,fontStyle:"italic"}}>No links attached</div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {/* Search results — status mode */}
                  {d.type === "search_status" && d.results && (
                    <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
                      {d.results.map((r, i) => {
                        const C = TC(r.tk);
                        const shade = C.shades ? C.shades[r.sub.color % C.shades.length] : C.base;
                        const pct = r.childCount > 0 ? Math.round(r.childDone / r.childCount * 100) : (r.task.done ? 100 : 0);
                        return (
                          <div key={i} style={{background:shade+"08",border:`1.5px solid ${shade}25`,borderLeft:`3px solid ${shade}`,borderRadius:8,padding:10}}>
                            <div style={{display:"flex",alignItems:"center",gap:8}}>
                              <div style={{position:"relative",width:30,height:30,flexShrink:0}}>
                                <svg width="30" height="30" viewBox="0 0 30 30">
                                  <circle cx="15" cy="15" r="12" fill="none" stroke={shade+"20"} strokeWidth="2.5" />
                                  <circle cx="15" cy="15" r="12" fill="none" stroke={pct===100?"#22c55e":shade} strokeWidth="2.5"
                                    strokeDasharray={75.4} strokeDashoffset={75.4*(1-pct/100)}
                                    strokeLinecap="round" transform="rotate(-90 15 15)" />
                                </svg>
                                <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:700,color:pct===100?"#22c55e":shade}}>{pct}%</div>
                              </div>
                              <div style={{flex:1}}>
                                <div style={{fontSize:11,fontWeight:700,color:T.text}}>{r.task.text}</div>
                              </div>
                              <span style={{fontSize:9,fontWeight:700,color:pct===100?"#22c55e":r.task.done?"#22c55e":shade,fontFamily:P_ALL.coach.font}}>
                                {r.task.done ? "✅ DONE" : r.childCount > 0 ? `${r.childDone}/${r.childCount}` : "⏳ PENDING"}
                              </span>
                            </div>
                            {r.childCount > 0 && (
                              <div style={{background:shade+"10",borderRadius:4,height:4,overflow:"hidden",marginTop:6}}>
                                <div style={{height:"100%",background:pct===100?"#22c55e":shade,width:`${pct}%`,borderRadius:4,transition:"width 0.3s"}} />
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
          {chatLoading && (
            <div style={{display:"flex",justifyContent:"flex-start",marginBottom:8}}>
              <div style={{padding:"10px 14px",borderRadius:"3px 14px 14px 14px",background:T.cardBg,border:"1px solid "+T.border}}>
                <div style={{fontSize:7,fontFamily:P.font,color:TC("coach").base,letterSpacing:2,marginBottom:4,opacity:0.7}}>COACH</div>
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:TC("coach").base,opacity:0.4,animation:"pulse 1s infinite"}} />
                  <div style={{width:6,height:6,borderRadius:"50%",background:TC("coach").base,opacity:0.4,animation:"pulse 1s infinite 0.2s"}} />
                  <div style={{width:6,height:6,borderRadius:"50%",background:TC("coach").base,opacity:0.4,animation:"pulse 1s infinite 0.4s"}} />
                  <span style={{fontSize:9,color:T.textMut,marginLeft:6,fontFamily:P.font,letterSpacing:1}}>ASKING CLAUDE...</span>
                </div>
              </div>
            </div>
          )}
          <div ref={chatEndRef} />
        </div>

        {/* Input bar - sticky bottom */}
        <div style={{
          position:"fixed",bottom:0,left:0,right:0,
          padding:"12px 16px 16px",
          background:T.bg,borderTop:"1px solid "+T.border,
          maxWidth:620,margin:"0 auto",
        }}>
          <div style={{display:"flex",gap:8,alignItems:"center",padding:"4px 4px 4px 14px",background:T.cardBg,borderRadius:14,border:"1px solid "+T.border}}>
            <input
              ref={chatInputRef}
              style={{flex:1,border:"none",background:"transparent",fontSize:13,padding:"10px 0",color:T.text,outline:"none",fontFamily:P.bodyFont}}
              placeholder={wknd?"What needs doing?":"ENTER TARGET..."}
              value={chatInput}
              onChange={e=>setChatInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter")handleChatSend();}}
            />
            <button onClick={handleChatSend} style={{
              background:TC("coach").base,border:"none",color:"#fff",
              padding:"10px 18px",borderRadius:10,cursor:"pointer",
              fontSize:10,fontWeight:700,letterSpacing:2,fontFamily:P.font,
              opacity:chatInput.trim()?1:0.4,transition:"all 0.15s",
            }}>{wknd?"SEND":"FIRE"}</button>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={{background:T.bg,color:T.text,minHeight:"100vh",transition:"background 0.4s,color 0.4s"}}>
      <style>{FONTS_CSS}{`*{box-sizing:border-box;margin:0;padding:0}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:${T.border};border-radius:4px}textarea{font-family:inherit}input[type=number]::-webkit-inner-spin-button{opacity:0.3}a:hover{opacity:0.8}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}`}</style>
      <div style={{background:T.topBar,borderBottom:`1px solid ${T.border}`,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(20px)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>{setView("dashboard");setSelectedTeam(null);}}>
          <span style={{fontSize:20}}>⚽</span>
          <span style={{fontFamily:P_ALL.coach.font,fontSize:14,fontWeight:700,letterSpacing:3,color:T.text}}>SQUAD</span>
        </div>
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <button onClick={()=>{setView("dashboard");setSelectedTeam(null);setHomeMode("dashboard");}} style={{background:view==="dashboard"&&homeMode==="dashboard"?T.navAct:"transparent",border:`1px solid ${view==="dashboard"&&homeMode==="dashboard"?T.borderStr:"transparent"}`,color:view==="dashboard"&&homeMode==="dashboard"?T.navActTxt:T.navTxt,padding:"5px 10px",borderRadius:6,cursor:"pointer",fontFamily:P_ALL.coach.font,fontSize:10,letterSpacing:2}}>HOME</button>
          <button onClick={()=>{setView("dashboard");setSelectedTeam(null);setHomeMode(homeMode==="chat"?"dashboard":"chat");if(homeMode!=="chat"){setChatMessages([]);}}} style={{background:homeMode==="chat"&&view==="dashboard"?TC("coach").base+"20":"transparent",border:`1px solid ${homeMode==="chat"&&view==="dashboard"?TC("coach").base+"40":"transparent"}`,color:homeMode==="chat"&&view==="dashboard"?TC("coach").base:T.navTxt,padding:"5px 8px",borderRadius:6,cursor:"pointer",fontSize:12}} title="Chat Mode">💬</button>
          {["attackers","midPlayers","defenders"].map(tk=>(<button key={tk} onClick={()=>{setView("team");setSelectedTeam(tk);}} style={{background:(view==="team"&&selectedTeam===tk)?TC(tk).lighter:"transparent",border:`1px solid ${(view==="team"&&selectedTeam===tk)?TC(tk).border:"transparent"}`,color:(view==="team"&&selectedTeam===tk)?TC(tk).base:T.navTxt,padding:"5px 8px",borderRadius:6,cursor:"pointer",fontSize:14}}>{getTeamIcon(tk)}</button>))}
          <button onClick={()=>setView("coach")} style={{background:view==="coach"?TC("coach").lighter:"transparent",border:`1px solid ${view==="coach"?TC("coach").border:"transparent"}`,color:view==="coach"?TC("coach").base:T.navTxt,padding:"5px 8px",borderRadius:6,cursor:"pointer",fontSize:14}}>📋</button>
        </div>
      </div>
      {view==="dashboard"&&homeMode==="chat"&&renderChat()}
      {view==="dashboard"&&homeMode!=="chat"&&renderDash()}
      {view==="team"&&renderTeam()}
      {view==="coach"&&renderCoach()}
      {showCoachSession&&renderModal()}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(TeamTaskManager));
</script>
</body>
</html>
