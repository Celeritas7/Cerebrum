function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function isWeekend() { const d = new Date().getDay(); return d === 0 || d === 6; }
function getTodayKey() { return new Date().toISOString().split("T")[0]; }
function getTeamLabel(k) { return k === "attackers" ? "ATTACKERS" : k === "midPlayers" ? "Mid Players" : k === "defenders" ? "Defenders" : "COACH"; }
function getTeamIcon(k) { return k === "attackers" ? "⚔️" : k === "midPlayers" ? "⚡" : k === "defenders" ? "🛡️" : "📋"; }
function isDayTime() { const h = new Date().getHours(); return h >= 6 && h < 18; }
function getWeekDates() {
  const now = new Date(); const day = now.getDay(); const mon = new Date(now);
  mon.setDate(now.getDate() - ((day + 6) % 7));
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon); d.setDate(mon.getDate() + i);
    return { key: d.toISOString().split("T")[0], label: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i], date: d.getDate(), isToday: d.toISOString().split("T")[0] === getTodayKey(), isWeekend: i >= 5 };
  });
}

// ─── RECURSIVE TASK TREE HELPERS (stable, outside component) ───
function countAllTasks(tasks) {
  if (!tasks || !Array.isArray(tasks)) return 0;
  let c = 0;
  for (const t of tasks) { c++; if (t.children && t.children.length) c += countAllTasks(t.children); }
  return c;
}
function countDoneTasks(tasks) {
  if (!tasks || !Array.isArray(tasks)) return 0;
  let c = 0;
  for (const t of tasks) { if (t.done) c++; if (t.children && t.children.length) c += countDoneTasks(t.children); }
  return c;
}
function toggleTaskInTree(tasks, tid) {
  if (!tasks) return [];
  return tasks.map(t => {
    if (t.id === tid) return { ...t, done: !t.done };
    if (t.children && t.children.length) return { ...t, children: toggleTaskInTree(t.children, tid) };
    return t;
  });
}
function addChildToTree(tasks, parentId, newTask) {
  if (!tasks) return [];
  return tasks.map(t => {
    if (t.id === parentId) return { ...t, children: [...(t.children || []), newTask] };
    // Recurse even if children is empty array (not just length > 0)
    if (t.children) return { ...t, children: addChildToTree(t.children, parentId, newTask) };
    return t;
  });
}
function removeFromTree(tasks, tid) {
  if (!tasks) return [];
  return tasks.filter(t => t.id !== tid).map(t => {
    if (t.children && t.children.length) return { ...t, children: removeFromTree(t.children, tid) };
    return t;
  });
}
function findInTree(tasks, tid) {
  if (!tasks) return null;
  for (const t of tasks) {
    if (t.id === tid) return t;
    if (t.children && t.children.length) { const f = findInTree(t.children, tid); if (f) return f; }
  }
  return null;
}
function resetTreeRecurring(tasks) {
  if (!tasks) return [];
  return tasks.map(t => ({
    ...t,
    done: t.recurring ? false : t.done,
    children: t.children ? resetTreeRecurring(t.children) : undefined,
  }));
}
// Ensure all attacker tasks have children array (migration helper)
function migrateAttackerTasks(tasks) {
  if (!tasks) return [];
  return tasks.map(t => ({
    ...t,
    children: Array.isArray(t.children) ? migrateAttackerTasks(t.children) : [],
    links: Array.isArray(t.links) ? t.links : [],
  }));
}
// Add/remove link in task tree
function addLinkInTree(tasks, tid, link) {
  if (!tasks) return [];
  return tasks.map(t => {
    if (t.id === tid) return { ...t, links: [...(t.links || []), link] };
    if (t.children) return { ...t, children: addLinkInTree(t.children, tid, link) };
    return t;
  });
}
function removeLinkInTree(tasks, tid, linkId) {
  if (!tasks) return [];
  return tasks.map(t => {
    if (t.id === tid) return { ...t, links: (t.links || []).filter(l => l.id !== linkId) };
    if (t.children) return { ...t, children: removeLinkInTree(t.children, tid, linkId) };
    return t;
  });
}

// ─── NAIVE BAYES CLASSIFIER FOR TASK ROUTING ───
function tokenize(text) {
  return (text || "").toLowerCase().replace(/[^a-z0-9\u3000-\u9fff\u1000-\u109f]/g, " ").split(/\s+/).filter(w => w.length > 1);
}

function buildNBClassifier(subteams, tags) {
  // Categories: "teamKey::subId" e.g. "attackers::a1"
  const catWordCounts = {}; // { category: { word: count } }
  const catDocCounts = {};  // { category: totalDocs }
  const vocab = new Set();
  let totalDocs = 0;

  const addDoc = (category, words) => {
    if (!catWordCounts[category]) catWordCounts[category] = {};
    catDocCounts[category] = (catDocCounts[category] || 0) + 1;
    totalDocs++;
    for (const w of words) {
      vocab.add(w);
      catWordCounts[category][w] = (catWordCounts[category][w] || 0) + 1;
    }
  };

  // Train from sub-team names
  for (const tk of ["attackers", "midPlayers", "defenders"]) {
    for (const sub of (subteams[tk] || [])) {
      const cat = `${tk}::${sub.id}`;
      addDoc(cat, tokenize(sub.name));
      addDoc(cat, tokenize(sub.name)); // double weight on name
      // Train from existing tasks at all depths
      const trainFromTasks = (tasks) => {
        for (const t of (tasks || [])) {
          addDoc(cat, tokenize(t.text));
          if (t.children) trainFromTasks(t.children);
        }
      };
      trainFromTasks(sub.tasks);
    }
  }
  // Train from tag keywords → map to sub-teams that use those tags
  for (const tk of ["attackers"]) {
    for (const sub of (subteams[tk] || [])) {
      const cat = `${tk}::${sub.id}`;
      const collectTags = (tasks) => {
        for (const t of (tasks || [])) {
          if (t.tagId) {
            const tag = (tags || []).find(tg => tg.id === t.tagId);
            if (tag) addDoc(cat, tag.keywords || []);
          }
          if (t.children) collectTags(t.children);
        }
      };
      collectTags(sub.tasks);
    }
  }
  return { catWordCounts, catDocCounts, vocab: [...vocab], totalDocs };
}

function classifyNB(text, model) {
  if (!model || !model.totalDocs) return [];
  const words = tokenize(text);
  if (!words.length) return [];
  const { catWordCounts, catDocCounts, vocab, totalDocs } = model;
  const V = vocab.length || 1;
  const results = [];

  for (const cat of Object.keys(catDocCounts)) {
    // Log prior P(c)
    let logProb = Math.log((catDocCounts[cat] || 0.1) / totalDocs);
    const wc = catWordCounts[cat] || {};
    const totalWords = Object.values(wc).reduce((a, b) => a + b, 0);
    // Log likelihood P(w|c) with Laplace smoothing
    for (const w of words) {
      logProb += Math.log(((wc[w] || 0) + 1) / (totalWords + V));
    }
    const [tk, subId] = cat.split("::");
    results.push({ category: cat, teamKey: tk, subId, logProb });
  }
  // Sort by probability (highest first), convert to normalized scores
  results.sort((a, b) => b.logProb - a.logProb);
  const maxLog = results[0]?.logProb || 0;
  const expSum = results.reduce((a, r) => a + Math.exp(r.logProb - maxLog), 0);
  return results.map(r => ({ ...r, confidence: Math.exp(r.logProb - maxLog) / expSum }));
}

// Auto-tag: scan text against all tag keywords, return best match tag id or null
function autoTagText(text, tags) {
  if (!text || !tags || !tags.length) return null;
  const lower = text.toLowerCase();
  let bestTag = null;
  let bestScore = 0;
  for (const tag of tags) {
    let score = 0;
    for (const kw of (tag.keywords || [])) {
      if (lower.includes(kw.toLowerCase())) score++;
    }
    if (score > bestScore) { bestScore = score; bestTag = tag.id; }
  }
  return bestTag;
}

      : ["⚔️ WEEKDAY. ATTACK MODE ENGAGED.", "STRIKE TARGETS FIRST, THEN MAINTAIN THE LINE.", "NO EXCUSES. EXECUTE."];
    msgs.push(mkCoach(greetings[0]));
    msgs.push(mkCoach(greetings[1]));
    for (const tk of order) {
      const fp = (state.fieldPlayers || {})[tk] || [];
      const allSubs = state.subteams[tk] || [];
      const subs = fp.length > 0 ? allSubs.filter(s => fp.includes(s.id)) : allSubs;
      if (!subs.length) continue;
      const label = tk === "attackers" ? "⚔️ ATTACKERS" : tk === "midPlayers" ? "⚡ MID PLAYERS" : "🛡️ DEFENDERS";
      let total = 0, done = 0;
      for (const sub of subs) {
        if (tk === "attackers") {
          const fIds = ((state.focusedTasks || {})[sub.id] || []);
          const vis = fIds.length > 0 ? sub.tasks.filter(t => fIds.includes(t.id)) : sub.tasks;
          total += countAllTasks(vis); done += countDoneTasks(vis);
        } else {
          total += sub.tasks.length; done += sub.tasks.filter(t => t.done).length;
        }
      }
      const pct = total > 0 ? Math.round(done / total * 100) : 0;
      msgs.push(mkCoach(label + " — " + done + "/" + total + " COMPLETE (" + pct + "%)", { type: "team_summary", teamKey: tk }));
    }
    msgs.push(mkCoach("💰 CREDITS: ⚔️" + state.credits.attackers + " | ⚡" + state.credits.midPlayers + " | 🛡️" + state.credits.defenders));
    msgs.push(mkCoach(greetings[2]));
    msgs.push(mkCoach("TYPE A NEW TASK AND I'LL ROUTE IT, OR TAP BELOW TO INSPECT A TEAM. 👇", { type: "quick_actions" }));
    setChatMessages(msgs);
    setChatStep("idle");
  }, [loaded, homeMode, state, chatMessages.length]);

  const handleChatSubmit = useCallback(() => {
    if (!chatInput.trim()) return;
    const text = chatInput.trim();
    setChatInput("");
    if (chatStep === "awaiting_confirm" && chatPendingTask) setChatPendingTask(null);
    setChatMessages(prev => [...prev, mkUser(text)]);
    const lower = text.toLowerCase();
    if (lower.match(/^(show|list|view)\s+(attacker|attack|mid|defender|defense)/)) {
      const tk = lower.includes("attack") ? "attackers" : lower.includes("mid") ? "midPlayers" : "defenders";
      const label = tk === "attackers" ? "⚔️ ATTACKERS" : tk === "midPlayers" ? "⚡ MID PLAYERS" : "🛡️ DEFENDERS";
      setTimeout(() => setChatMessages(prev => [...prev, mkCoach(label + " — FULL ROSTER:", { type: "show_tasks", teamKey: tk })]), 200);
      return;
    }
    const results = classifyNB(text, nbModelRef.current);
    const top3 = results.slice(0, 3).filter(r => r.confidence > 0.05);
    if (top3.length > 0) {
      setChatSuggestions(top3);
      setChatPendingTask({ text });
      setChatStep("awaiting_confirm");
      setTimeout(() => setChatMessages(prev => [...prev, mkCoach("🧠 NAIVE BAYES: " + top3.length + " MATCH" + (top3.length > 1 ? "ES" : "") + ":", { type: "suggestions", suggestions: top3, taskText: text })]), 300);
    } else {
      setChatPendingTask({ text });
      setChatStep("awaiting_confirm");
      setTimeout(() => setChatMessages(prev => [...prev, mkCoach("⚠️ LOW CONFIDENCE — PICK MANUALLY:", { type: "manual_pick", taskText: text })]), 300);
    }
  }, [chatInput, chatStep, chatPendingTask, state]);

  const confirmTaskRoute = useCallback((teamKey, subId, text) => {
    addTask(teamKey, subId, text);
    const label = teamKey === "attackers" ? "⚔️ ATTACKERS" : teamKey === "midPlayers" ? "⚡ MID PLAYERS" : "🛡️ DEFENDERS";
    const subName = state?.subteams?.[teamKey]?.find(s => s.id === subId)?.name || subId;
    setChatMessages(prev => [...prev, mkCoach("✅ DEPLOYED \"" + text.toUpperCase() + "\" → " + label + " / " + subName + ". DONE.")]);
    setChatPendingTask(null);
    setChatSuggestions([]);
    setChatStep("idle");
  }, [addTask, state]);

  const showTeamInChat = useCallback((tk) => {
    const label = tk === "attackers" ? "⚔️ ATTACKERS" : tk === "midPlayers" ? "⚡ MID PLAYERS" : "🛡️ DEFENDERS";
    setChatMessages(prev => [...prev, mkCoach(label + " — FULL ROSTER:", { type: "show_tasks", teamKey: tk })]);
  }, []);

  const getSubName = (tk, sid) => {
    const sub = state?.subteams?.[tk]?.find(s => s.id === sid);
    return sub ? sub.name : sid;
  };
  const chatTeamLabel = (tk) => tk === "attackers" ? "⚔️ ATTACKERS" : tk === "midPlayers" ? "⚡ MID PLAYERS" : tk === "defenders" ? "🛡️ DEFENDERS" : tk;

  if (!loaded || !state) return (
    <div style={{background:"#080B12",color:"#fff",height:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}><div style={{fontSize:48,marginBottom:16}}>⚽</div><div style={{fontFamily:"'Space Mono',monospace",fontSize:12,letterSpacing:6,opacity:0.4}}>ASSEMBLING SQUAD...</div></div>
    </div>
  );

  const fullLocked = state.lockdown && new Date() < new Date(state.lockdown.until) && !state.lockdown.resolved;
  const inp = (tk) => ({background:T.inputBg,border:`1px solid ${T.inputBrd}`,color:T.text,padding:"8px 12px",borderRadius:P_ALL[tk||"coach"].btnStyle.borderRadius,fontSize:13,fontFamily:P_ALL[tk||"coach"].bodyFont,outline:"none",width:"100%"});
  const btn = (tk,color) => ({background:color||T.surface,border:"none",color:color&&color!=="transparent"?"#fff":T.text,padding:"8px 16px",cursor:"pointer",fontFamily:P_ALL[tk||"coach"].font,transition:"all 0.15s",...P_ALL[tk||"coach"].btnStyle});

  /* ─── FOOTBALL FIELD ─── */
  const getFormation = (count) => {
    // Symmetric positions around x=50%, distributed vertically within a zone
    const F = {
      1: [{x:50,y:50}],
      2: [{x:35,y:50},{x:65,y:50}],
      3: [{x:22,y:55},{x:50,y:40},{x:78,y:55}],
      4: [{x:18,y:55},{x:40,y:40},{x:60,y:40},{x:82,y:55}],
      5: [{x:15,y:58},{x:35,y:42},{x:50,y:35},{x:65,y:42},{x:85,y:58}],
      6: [{x:15,y:58},{x:35,y:42},{x:50,y:32},{x:65,y:42},{x:85,y:58},{x:50,y:55}],
      7: [{x:12,y:60},{x:30,y:42},{x:50,y:30},{x:70,y:42},{x:88,y:60},{x:35,y:58},{x:65,y:58}],
      8: [{x:12,y:62},{x:28,y:45},{x:44,y:32},{x:56,y:32},{x:72,y:45},{x:88,y:62},{x:35,y:58},{x:65,y:58}],
      9: [{x:10,y:62},{x:25,y:48},{x:40,y:35},{x:50,y:28},{x:60,y:35},{x:75,y:48},{x:90,y:62},{x:33,y:60},{x:67,y:60}],
      10:[{x:10,y:64},{x:24,y:50},{x:38,y:36},{x:50,y:26},{x:62,y:36},{x:76,y:50},{x:90,y:64},{x:30,y:62},{x:50,y:56},{x:70,y:62}],
    };
    return F[Math.min(count, 10)] || F[1];
  };

  // Map formation positions into team zones on the pitch
  const getZonePositions = (team, subs) => {
    const count = subs.length;
    if (count === 0) return [];
    const base = getFormation(count);
    const zoneMap = { attackers: {yOff:2,yScale:0.28}, midPlayers: {yOff:32,yScale:0.32}, defenders: {yOff:66,yScale:0.30} };
    const z = zoneMap[team];
    return base.map(p => ({
      x: p.x,
      y: z.yOff + (p.y / 100) * (z.yScale * 100),
    }));
  };

  const toggleFieldPlayer = (tk, subId) => {
    setState(prev => {
      const fp = prev.fieldPlayers || {attackers:[],midPlayers:[],defenders:[]};
      const arr = fp[tk] || [];
      return {...prev, fieldPlayers: {...fp, [tk]: arr.includes(subId) ? arr.filter(id => id !== subId) : [...arr, subId]}};
    });
  };

  const renderPlayerCircle = (sub, tk, size, showLabel) => {
    const C = TC(tk); const P = P_ALL[tk];
    const shade = C.shades[sub.color % C.shades.length];
    return (
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
        <div style={{
          background:`radial-gradient(circle at 35% 35%, ${shade}, ${shade}cc)`,
          border:"3px solid rgba(255,255,255,0.9)", borderRadius:"50%",
          width:size, height:size, display:"flex", alignItems:"center", justifyContent:"center",
          boxShadow:"0 2px 8px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(0,0,0,0.2)",
        }}>
          <span style={{
            fontSize: size > 36 ? 9 : 7, fontFamily: P.font, color:"#fff", textAlign:"center",
            lineHeight:"1.1", letterSpacing:0.3, fontWeight:700, textShadow:"0 1px 2px rgba(0,0,0,0.5)",
          }}>
            {sub.name.substring(0,3)}
          </span>
        </div>
        {showLabel && (
          <span style={{
            fontSize:7, fontFamily:P.bodyFont, color:"#fff", textAlign:"center",
            textShadow:"0 1px 3px rgba(0,0,0,0.8)", maxWidth:56, overflow:"hidden",
            textOverflow:"ellipsis", whiteSpace:"nowrap", letterSpacing:0.5,
          }}>
            {sub.name}
          </span>
        )}
      </div>
    );
  };

  const renderField = () => {
    const weekDates = getWeekDates();

    const allTeams = ["attackers","midPlayers","defenders"];

    allTeams.forEach(tk => {

      allDeployed[tk] = state.subteams[tk].filter(sub => ids.includes(sub.id));

    return (

          <div style={{...P_ALL.coach.labelStyle,color:T.textMut}}>⚽ TACTICAL BOARD — WEEKLY FORMATION</div>

        {/* Day selector */}
        <div style={{display:"flex",gap:4,marginBottom:14,flexWrap:"wrap"}}>
          {weekDates.map(d => (
            <button key={d.key} onClick={() => setFieldDay(d.key)} style={{
              background:d.key===fieldDay?TC("coach").base:d.isWeekend?T.surface:"transparent",
              border:`1px solid ${d.key===fieldDay?TC("coach").base:d.isWeekend?T.borderStr:T.border}`,

              fontFamily:P_ALL.coach.font,fontSize:10,letterSpacing:1,
            }}>
              <div style={{fontWeight:700}}>{d.label}</div>
              <div style={{fontSize:9,opacity:0.7,marginTop:2}}>{d.date}</div>
              {d.isWeekend && <div style={{fontSize:7,opacity:0.5,marginTop:1}}>STRICT</div>}
            </button>
          ))}
        </div>

        {/* Team Tabs - deploy team first */}
        <div style={{display:"flex",gap:6,marginBottom:10}}>
          {allTeams.map(tk => {
            const isActive = fieldSelected === tk;
            const C = TC(tk); const P = P_ALL[tk];
            const deployed = (((state.fieldPlayers||{})[tk])||[]).length;
            const total = state.subteams[tk].length;
            return (
              <button key={tk} onClick={() => setFieldSelected(isActive ? null : tk)} style={{
                flex:1, background:isActive ? C.base : T.surface,
                border:`2px solid ${isActive ? C.base : C.border}`,
                borderRadius:6, padding:"8px 4px", cursor:"pointer", textAlign:"center",
                transition:"all 0.2s",
              }}>
                <div style={{fontSize:14,marginBottom:2}}>{getTeamIcon(tk)}</div>
                <div style={{fontFamily:P.font,fontSize:9,color:isActive?"#fff":C.base,letterSpacing:1,...P.titleStyle,fontSize:9}}>
                  {P.nameDisplay}
                </div>
                <div style={{fontSize:8,color:isActive?"rgba(255,255,255,0.7)":T.textMut,marginTop:2,fontFamily:P_ALL.coach.font}}>
                  {deployed}/{total} deployed
                </div>
              </button>
            );
          })}
        </div>

        {/* Sub-team pills for selected team - like the category filter */}
        {fieldSelected && (
          <div style={{marginBottom:12}}>
            <div style={{fontFamily:P_ALL[fieldSelected].font,fontSize:10,color:T.textMut,letterSpacing:2,marginBottom:8,...P_ALL[fieldSelected].labelStyle}}>
              {fieldSelected === "attackers" ? "SELECT UNITS TO DEPLOY" : fieldSelected === "defenders" ? "SELECT SECTORS TO ACTIVATE" : "Select players for the field"}
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {state.subteams[fieldSelected].map(sub => {
                const isDeployed = (((state.fieldPlayers||{})[fieldSelected])||[]).includes(sub.id);
                const C = TC(fieldSelected); const P = P_ALL[fieldSelected];
                const shade = C.shades[sub.color % C.shades.length];
                const planned = getPlanned(fieldSelected).length;
                return (
                  <button key={sub.id} onClick={() => toggleFieldPlayer(fieldSelected, sub.id)} style={{
                    display:"flex", alignItems:"center", gap:6,
                    background: isDeployed ? shade : T.surface,
                    border: `2px solid ${isDeployed ? shade : T.borderStr}`,
                    borderRadius: 20, padding:"6px 14px 6px 8px", cursor:"pointer",
                    transition:"all 0.2s",
                  }}>
                    {/* Mini player circle */}
                    <div style={{
                      width:22, height:22, borderRadius:"50%",
                      background: isDeployed ? "rgba(255,255,255,0.25)" : `radial-gradient(circle, ${shade}, ${shade}cc)`,
                      border: isDeployed ? "2px solid rgba(255,255,255,0.6)" : `2px solid ${shade}40`,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:7, color: isDeployed ? "#fff" : shade, fontWeight:700,
                      fontFamily:P.font,
                    }}>
                      {sub.name.substring(0,2)}
                    </div>
                    <span style={{
                      fontFamily:P.bodyFont, fontSize:12, fontWeight:600, letterSpacing:0.5,
                      color: isDeployed ? "#fff" : T.text,
                    }}>
                      {sub.name}
                    </span>
                    {/* Task count badge */}
                    <span style={{
                      background: isDeployed ? "rgba(255,255,255,0.25)" : T.border,
                      color: isDeployed ? "#fff" : T.textMut,
                      borderRadius:10, padding:"1px 6px", fontSize:9, fontWeight:700,
                      fontFamily:P_ALL.coach.font, marginLeft:2,
                    }}>
                      {sub.tasks.length}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* ══ THE PITCH ══ */}
        <div style={{
          background:T.fieldBg, borderRadius:8, position:"relative", overflow:"hidden",
          border:`2px solid ${T.fieldLine}`, height:pitchHeight,
        }}>
          {/* Grass stripes */}
          {[0,1,2,3,4,5,6,7].map(i => (
            <div key={i} style={{position:"absolute",top:`${i*12.5}%`,left:0,right:0,height:"12.5%",background:i%2===0?T.fieldGrass:"transparent",opacity:0.25}} />

          {/* Field markings */}
          <div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
            <div style={{position:"absolute",top:"50%",left:"5%",right:"5%",height:1,background:T.fieldLine}} />
            <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:50,height:50,borderRadius:"50%",border:`1px solid ${T.fieldLine}`}} />
            <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:5,height:5,borderRadius:"50%",background:T.fieldLine}} />
            <div style={{position:"absolute",top:0,left:"20%",width:"60%",height:"14%",borderBottom:`1px solid ${T.fieldLine}`,borderLeft:`1px solid ${T.fieldLine}`,borderRight:`1px solid ${T.fieldLine}`}} />
            <div style={{position:"absolute",top:0,left:"35%",width:"30%",height:"6%",borderBottom:`1px solid ${T.fieldLine}`,borderLeft:`1px solid ${T.fieldLine}`,borderRight:`1px solid ${T.fieldLine}`}} />
            <div style={{position:"absolute",bottom:0,left:"20%",width:"60%",height:"14%",borderTop:`1px solid ${T.fieldLine}`,borderLeft:`1px solid ${T.fieldLine}`,borderRight:`1px solid ${T.fieldLine}`}} />
            <div style={{position:"absolute",bottom:0,left:"35%",width:"30%",height:"6%",borderTop:`1px solid ${T.fieldLine}`,borderLeft:`1px solid ${T.fieldLine}`,borderRight:`1px solid ${T.fieldLine}`}} />
            {/* Zone labels */}
            {allDeployed.attackers.length > 0 && <div style={{position:"absolute",top:"3%",left:"50%",transform:"translateX(-50%)",fontSize:8,fontFamily:P_ALL.coach.font,color:T.fieldLine,letterSpacing:3,opacity:0.5}}>ATK</div>}
            {allDeployed.midPlayers.length > 0 && <div style={{position:"absolute",top:"48%",left:"5%",fontSize:8,fontFamily:P_ALL.coach.font,color:T.fieldLine,letterSpacing:3,opacity:0.4}}>MID</div>}
            {allDeployed.defenders.length > 0 && <div style={{position:"absolute",bottom:"3%",left:"50%",transform:"translateX(-50%)",fontSize:8,fontFamily:P_ALL.coach.font,color:T.fieldLine,letterSpacing:3,opacity:0.5}}>DEF</div>}
          </div>

          {/* Players on pitch */}
          <div style={{position:"absolute",inset:0,zIndex:2}}>
            {allTeams.map(tk => {
              const deployed = allDeployed[tk];
              if (deployed.length === 0) return null;
              const positions = getZonePositions(tk, deployed);
              return deployed.map((sub, i) => {
                const pos = positions[i] || {x:50,y:50};
                return (
                  <div key={sub.id} style={{
                    position:"absolute", left:`${pos.x}%`, top:`${pos.y}%`,
                    transform:"translate(-50%,-50%)", zIndex:3,
                    transition:"all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)",
                  }}>
                    {renderPlayerCircle(sub, tk, 40, true)}
                  </div>
                );
              });
            })}
          </div>

          {/* Empty pitch message */}
          {totalOnPitch === 0 && (
            <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}>
              <div style={{textAlign:"center",opacity:0.45}}>
                <div style={{fontSize:32,marginBottom:8}}>⚽</div>
                <div style={{fontFamily:P_ALL.coach.font,fontSize:10,color:"#fff",letterSpacing:3,textShadow:"0 1px 4px rgba(0,0,0,0.5)"}}>
                  PITCH EMPTY
                </div>
                <div style={{fontFamily:P_ALL.coach.font,fontSize:8,color:"#fff",letterSpacing:2,marginTop:4,opacity:0.6}}>
                  SELECT A TEAM & DEPLOY PLAYERS
                </div>
              </div>
            </div>
          )}

          {/* Sideline Coach + bench players */}
          <div style={{
            position:"absolute", right:0, top:0, bottom:0, width:40,
            background:"rgba(0,0,0,0.25)", borderLeft:`1px dashed ${T.fieldLine}`,
            display:"flex", flexDirection:"column", alignItems:"center",
            paddingTop:8, gap:4, zIndex:4, overflow:"hidden",
          }}>
            <div style={{
              width:24,height:24,borderRadius:"50%",
              background:`radial-gradient(circle at 35% 35%, ${TC("coach").base}, ${TC("coach").base}cc)`,
              border:"2px solid rgba(255,255,255,0.8)", display:"flex",alignItems:"center",justifyContent:"center",
              boxShadow:"0 1px 4px rgba(0,0,0,0.3)", flexShrink:0,
            }}>
              <span style={{fontSize:10}}>📋</span>
            </div>
            <div style={{fontSize:6,color:"#fff",fontFamily:P_ALL.coach.font,letterSpacing:1,opacity:0.6}}>COACH</div>
            <div style={{height:1,width:"60%",background:"rgba(255,255,255,0.15)",margin:"2px 0"}} />
            {/* Bench: non-deployed players (small, faded) */}
            {allTeams.map(tk => {
              const benchSubs = state.subteams[tk].filter(sub => !(((state.fieldPlayers||{})[tk])||[]).includes(sub.id));
              return benchSubs.map(sub => {
                const shade = TC(tk).shades[sub.color % TC(tk).shades.length];
                return (
                  <div key={sub.id} style={{opacity:0.4,flexShrink:0}} title={sub.name}>
                    <div style={{
                      width:18,height:18,borderRadius:"50%",
                      background:`radial-gradient(circle, ${shade}, ${shade}cc)`,
                      border:"2px solid rgba(255,255,255,0.5)",
                      display:"flex",alignItems:"center",justifyContent:"center",
                    }}>
                      <span style={{fontSize:5,color:"#fff",fontWeight:700,fontFamily:P_ALL[tk].font}}>{sub.name.substring(0,2)}</span>
                    </div>
                  </div>
                );
              });
            })}
          </div>
        </div>

        {/* Task planning panel for selected team */}
        {fieldSelected && (((state.fieldPlayers||{})[fieldSelected])||[]).length > 0 && (
          <div style={{marginTop:12,background:T.surface,borderRadius:6,padding:14,border:`1px solid ${TC(fieldSelected).border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontFamily:P_ALL[fieldSelected].font,color:TC(fieldSelected).base,fontSize:13,...P_ALL[fieldSelected].titleStyle}}>
                {getTeamIcon(fieldSelected)} {P_ALL[fieldSelected].nameDisplay} — {getWeekDates().find(d=>d.key===fieldDay)?.label} PLAN
              </div>
              <span style={{background:TC(fieldSelected).badge,color:"#fff",padding:"2px 8px",borderRadius:4,fontSize:10,fontFamily:P_ALL.coach.font}}>
                {(state.weeklyPlan[`${fieldDay}_${fieldSelected}`]||[]).length} tasks
              </span>
            </div>

            {(state.weeklyPlan[`${fieldDay}_${fieldSelected}`]||[]).map(task => (
              <div key={task.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:`1px solid ${T.border}`}}>
                <div onClick={() => togglePlanTask(fieldDay,fieldSelected,task.id)} style={{
                  width:18,height:18,borderRadius:P_ALL[fieldSelected].checkRadius,
                  border:`2px solid ${task.confirmed?TC(fieldSelected).base:T.chkOff}`,
                  background:task.confirmed?TC(fieldSelected).base:"transparent",
                  cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,
                }}>
                  {task.confirmed && <span style={{color:"#fff",fontSize:10}}>✓</span>}
                </div>

            <span style={{fontSize:22}}>📋</span>
            <div><div style={{fontFamily:P_ALL.coach.font,...P_ALL.coach.titleStyle,fontSize:18,color:TC("coach").base}}>COACH</div>
            <div style={{fontFamily:P_ALL.coach.bodyFont,fontSize:11,color:T.textMut,letterSpacing:2}}>{P_ALL.coach.tagline}</div></div>
          </div>
        </div>
      </div>
    );
  };

  /* ─── TEAM VIEW ─── */
  const renderTeam = () => {
    if (!selectedTeam) return null; const tk=selectedTeam;const P=P_ALL[tk];const C=TC(tk);
    return (
      <div style={{padding:16,maxWidth:620,margin:"0 auto"}}>
        <div style={{background:C.card,border:`${P.borderWidth}px solid ${C.border}`,borderRadius:P.cardRadius,padding:20,marginBottom:18,boxShadow:T.shadow}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontFamily:P.font,...P.labelStyle,color:T.textMut,marginBottom:6}}>{tk==="attackers"?"ASSAULT TEAM":tk==="defenders"?"DEFENSE SECTOR":"TEAM"}</div>
              <div style={{fontFamily:P.font,...P.titleStyle,fontSize:tk==="defenders"?20:24,color:C.base}}>{getTeamIcon(tk)} {P.nameDisplay}</div>
              <div style={{fontFamily:P.bodyFont,fontSize:11,color:T.textMut,marginTop:6}}>{P.tagline}</div></div>
            <div style={{textAlign:"right"}}><div style={{fontFamily:P.font,fontSize:34,fontWeight:700,color:C.base}}>{state.credits[tk]}</div>
              <div style={{fontFamily:P.bodyFont,...P.labelStyle,color:T.textMut}}>{tk==="defenders"?"SHIELD PTS":tk==="attackers"?"STRIKE PTS":"CREDITS"}</div></div>
          </div>
        </div>
        <div style={{background:T.cardBg,borderRadius:P.cardRadius,padding:12,marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",border:`${P.borderWidth}px solid ${T.border}`,boxShadow:T.shadow}}>
          <span style={{fontFamily:P.bodyFont,...P.labelStyle,color:T.textSec,fontSize:10}}>{isWeekend()?(tk==="defenders"?"⚠️ WEEKEND — ALL SHIELDS UP":tk==="attackers"?"⚠️ WEEKEND — STAND DOWN":"Weekend — strict"):(tk==="defenders"?"WEEKDAY — MAINTAIN PERIMETER":tk==="attackers"?"WEEKDAY — ENGAGE":"Weekday — fluid")}</span>
          <span style={{fontFamily:P.font,fontSize:14,fontWeight:700,color:getComp(tk)>=getMin(tk)?T.ok:T.warn}}>{getComp(tk)}/{getMin(tk)}</span>
        </div>
        {state.subteams[tk].map(sub => {
          const shade=C.shades[sub.color%C.shades.length];
          const taskTotal = tk === "attackers" ? countAllTasks(sub.tasks) : sub.tasks.length;
          const taskDone = tk === "attackers" ? countDoneTasks(sub.tasks) : sub.tasks.filter(t=>t.done).length;

          // Recursive attacker task renderer
          const renderAttackerTask = (task, depth = 0) => {
            const hasChildren = task.children?.length > 0;
            const hasLinks = (task.links || []).length > 0;
            const childDone = hasChildren ? countDoneTasks(task.children) : 0;
            const childTotal = hasChildren ? countAllTasks(task.children) : 0;
            const depthColors = [shade, C.shades[(sub.color+1)%C.shades.length], C.shades[(sub.color+2)%C.shades.length], C.shades[(sub.color+3)%C.shades.length]];
            const dColor = depthColors[Math.min(depth, depthColors.length-1)];
            const isAddingHere = addSubTo?.subId===sub.id && addSubTo?.parentId===task.id;
            const isAddingLink = addLinkTo?.subId===sub.id && addLinkTo?.taskId===task.id;
            const isPickingTag = tagPicker?.subId===sub.id && tagPicker?.taskId===task.id;
            const taskTag = task.tagId ? (state.tags||[]).find(t=>t.id===task.tagId) : null;
            return (
              <div key={task.id}>
                <div style={{
                  display:"flex", alignItems:"center", gap:6, padding:"8px 0",
                  paddingLeft: depth * 20,
                  borderBottom:`1px solid ${T.border}`,
                }}>
                  {depth > 0 && (
                    <div style={{width:12,height:12,borderLeft:`2px solid ${dColor}40`,borderBottom:`2px solid ${dColor}40`,borderRadius:"0 0 0 4px",flexShrink:0,marginLeft:-10}} />
                  )}
                  <div onClick={()=>completeTask(tk,sub.id,task.id)} style={{
                    width: Math.max(16, 22 - depth*2), height: Math.max(16, 22 - depth*2),
                    borderRadius:P.checkRadius, border:`2px solid ${task.done?dColor:T.chkOff}`,
                    background:task.done?dColor:"transparent", cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,
                  }}>
                    {task.done&&<span style={{color:"#fff",fontSize:Math.max(8,11-depth),fontWeight:700}}>✕</span>}
                  </div>
                  {/* Tag pill */}
                  {taskTag && (
                    <button onClick={(e)=>{e.stopPropagation();setTagPicker(isPickingTag?null:{subId:sub.id,taskId:task.id});}} style={{
                      background:taskTag.color+"20",border:`1.5px solid ${taskTag.color}50`,
                      color:taskTag.color,padding:"1px 7px",borderRadius:10,
                      fontSize:7,fontFamily:P_ALL.coach.font,fontWeight:700,letterSpacing:1,
                      cursor:"pointer",flexShrink:0,whiteSpace:"nowrap",
                    }}>{taskTag.name}</button>
                  )}
                  {!taskTag && (
                    <button onClick={(e)=>{e.stopPropagation();setTagPicker(isPickingTag?null:{subId:sub.id,taskId:task.id});}} style={{
                      background:"transparent",border:`1.5px dashed ${T.borderStr}`,
                      color:T.textMut,padding:"1px 6px",borderRadius:10,
                      fontSize:7,fontFamily:P_ALL.coach.font,cursor:"pointer",flexShrink:0,opacity:0.5,
                    }}>TAG</button>
                  )}
                  <span style={{
                    fontFamily:P.bodyFont,...P.taskStyle,
                    fontSize: Math.max(10, 14 - depth), opacity:task.done?0.3:1,
                    color:T.text, textDecoration:task.done?"line-through":"none", flex:1,
                  }}>
                    {task.text}
                  </span>
                  {hasLinks && (
                    <span style={{fontSize:8,color:dColor,fontFamily:P_ALL.coach.font,opacity:0.7}}>🔗{task.links.length}</span>
                  )}
                  {hasChildren && (
                    <span style={{
                      background:dColor+"18", color:dColor, padding:"1px 6px",
                      borderRadius:8, fontSize:8, fontFamily:P_ALL.coach.font, fontWeight:700,
                    }}>
                      {childDone}/{childTotal}
                    </span>
                  )}
                  {depth === 0 && task.recurring && (
                    <span style={{fontFamily:P.bodyFont,...P.labelStyle,fontSize:8,color:T.textMut}}>REPEAT</span>
                  )}
                  <button onClick={(e)=>{e.stopPropagation();setAddLinkTo({subId:sub.id,taskId:task.id});setTaskLinkTitle("");setTaskLinkUrl("");setAddSubTo(null);setTagPicker(null);}} style={{
                    background:isAddingLink ? dColor : "transparent",
                    border:`1.5px solid ${dColor}60`,
                    color:isAddingLink ? "#fff" : dColor,
                    cursor:"pointer", fontSize:8, fontWeight:700,
                    borderRadius:4, width:22, height:22,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    flexShrink:0, transition:"all 0.15s", opacity:isAddingLink?1:0.6,
                  }} title="Add link">🔗</button>
                  <button onClick={(e)=>{e.stopPropagation();setAddSubTo({subId:sub.id,parentId:task.id});setSubTaskText("");setShowAddTask(false);setAddLinkTo(null);setTagPicker(null);}} style={{
                    background:isAddingHere ? dColor : dColor+"20",
                    border:`1.5px solid ${dColor}`,
                    color:isAddingHere ? "#fff" : dColor,
                    cursor:"pointer", fontSize:10, fontWeight:700,
                    borderRadius:4, width:22, height:22,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    flexShrink:0, transition:"all 0.15s",
                  }} title="Add sub-target">+</button>
                  <button onClick={()=>removeTask(tk,sub.id,task.id)} style={{background:"transparent",border:"none",color:T.rmBtn,cursor:"pointer",fontSize:14,padding:"0 4px"}}>×</button>
                </div>
                {/* Tag picker */}
                {isPickingTag && (
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,padding:"6px 0 6px "+(depth*20+(depth>0?14:0))+"px",paddingLeft:depth*20+(depth>0?14:0),background:T.surface,borderRadius:4,margin:"2px 0"}}>
                    <button onClick={()=>{setTaskTag(sub.id,task.id,null);setTagPicker(null);}} style={{
                      background:!task.tagId?"#fff":"transparent",border:`1.5px solid ${T.borderStr}`,
                      color:T.textMut,padding:"2px 8px",borderRadius:10,fontSize:7,fontFamily:P_ALL.coach.font,cursor:"pointer",
                    }}>NONE</button>
                    {(state.tags||[]).map(tag => (
                      <button key={tag.id} onClick={()=>{setTaskTag(sub.id,task.id,tag.id);setTagPicker(null);}} style={{
                        background:task.tagId===tag.id?tag.color:tag.color+"20",
                        border:`1.5px solid ${tag.color}`,
                        color:task.tagId===tag.id?"#fff":tag.color,
                        padding:"2px 8px",borderRadius:10,fontSize:7,
                        fontFamily:P_ALL.coach.font,fontWeight:700,letterSpacing:1,cursor:"pointer",
                      }}>{tag.name}</button>
                    ))}
                    <button onClick={()=>setTagPicker(null)} style={{background:"transparent",border:"none",color:T.textSec,cursor:"pointer",fontSize:12}}>✕</button>
                  </div>
                )}
                {/* Task links */}
                {hasLinks && (
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,paddingLeft:depth*20+(depth>0?14:0),padding:"4px 0 4px "+(depth*20+(depth>0?14:0))+"px"}}>
                    {task.links.map(link => (
                      <div key={link.id} style={{display:"flex",alignItems:"center",gap:0}}>
                        <a href={link.url} target="_blank" rel="noopener noreferrer" style={{
                          background:dColor+(themeMode==="light"?"10":"14"),
                          border:`1.5px solid ${dColor}30`,
                          color:dColor,padding:"3px 8px",
                          borderRadius:`${P.btnStyle.borderRadius}px 0 0 ${P.btnStyle.borderRadius}px`,
                          fontSize:9,textDecoration:"none",fontFamily:P.font,letterSpacing:1,
                          display:"flex",alignItems:"center",gap:4,
                        }}>
                          <span style={{fontSize:8}}>⚡</span> {link.title}
                        </a>
                        <button onClick={()=>removeTaskLink(sub.id,task.id,link.id)} style={{
                          background:dColor+(themeMode==="light"?"10":"14"),
                          border:`1.5px solid ${dColor}30`,borderLeft:"none",
                          color:T.rmBtn,cursor:"pointer",fontSize:10,
                          padding:"3px 5px",
                          borderRadius:`0 ${P.btnStyle.borderRadius}px ${P.btnStyle.borderRadius}px 0`,
                        }}>×</button>
                      </div>
                    ))}
                  </div>
                )}
                {/* Add link input */}
                {isAddingLink && (
                  <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",paddingLeft:depth*20+(depth>0?14:0),padding:"6px 0 6px "+(depth*20+(depth>0?14:0))+"px"}}>
                    <input style={{...inp(tk),width:90,fontSize:10,padding:"5px 8px"}} placeholder="TITLE" value={taskLinkTitle} onChange={e=>setTaskLinkTitle(e.target.value)} autoFocus />
                    <input style={{...inp(tk),flex:1,minWidth:100,fontSize:10,padding:"5px 8px"}} placeholder="URL" value={taskLinkUrl} onChange={e=>setTaskLinkUrl(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"&&taskLinkTitle.trim()&&taskLinkUrl.trim()){addTaskLink(sub.id,task.id,taskLinkTitle.trim(),taskLinkUrl.trim());setTaskLinkTitle("");setTaskLinkUrl("");setAddLinkTo(null);}if(e.key==="Escape"){setAddLinkTo(null);}}} />
                    <button style={{...btn(tk,dColor),padding:"4px 10px",fontSize:9}} onClick={()=>{if(taskLinkTitle.trim()&&taskLinkUrl.trim()){addTaskLink(sub.id,task.id,taskLinkTitle.trim(),taskLinkUrl.trim());setTaskLinkTitle("");setTaskLinkUrl("");setAddLinkTo(null);}}}>🔗 LINK</button>
                    <button style={{background:"transparent",border:"none",color:T.textSec,cursor:"pointer",fontSize:14,fontWeight:700}} onClick={()=>setAddLinkTo(null)}>✕</button>
                  </div>
                )}
                {/* Sub-task input inline */}
                {isAddingHere && (
                  <div style={{display:"flex",gap:6,alignItems:"center",paddingLeft:(depth+1)*20+12,padding:"8px 0 8px "+((depth+1)*20+12)+"px"}}>
                    <div style={{width:12,height:12,borderLeft:`2px solid ${dColor}40`,borderBottom:`2px solid ${dColor}40`,borderRadius:"0 0 0 4px",flexShrink:0}} />
                    <input style={{...inp(tk),flex:1,fontSize:11,padding:"6px 10px"}} placeholder={`SUB-TARGET UNDER "${task.text}"...`} value={subTaskText} onChange={e=>setSubTaskText(e.target.value)} autoFocus
                      onKeyDown={e=>{if(e.key==="Enter"&&subTaskText.trim()){addTask(tk,sub.id,subTaskText.trim(),task.id);setSubTaskText("");setAddSubTo(null);}if(e.key==="Escape"){setAddSubTo(null);setSubTaskText("");}}} />
                    <button style={{...btn(tk,dColor),padding:"5px 12px",fontSize:10}} onClick={()=>{if(subTaskText.trim()){addTask(tk,sub.id,subTaskText.trim(),task.id);setSubTaskText("");setAddSubTo(null);}}}>DEPLOY</button>
                    <button style={{background:"transparent",border:"none",color:T.textSec,cursor:"pointer",fontSize:14,fontWeight:700}} onClick={()=>{setAddSubTo(null);setSubTaskText("");}}>✕</button>
                  </div>
                )}
                {hasChildren && task.children.map(child => renderAttackerTask(child, depth + 1))}
              </div>
            );
          };

          return (<div key={sub.id} style={{background:T.cardBg,border:`${P.borderWidth}px solid ${shade}${themeMode==="light"?"20":"25"}`,borderLeft:`${P.borderWidth+2}px solid ${shade}`,borderRadius:P.cardRadius,padding:16,marginBottom:14,boxShadow:T.shadow}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <span style={{fontFamily:P.font,...P.titleStyle,fontSize:13,color:shade}}>{sub.name}</span>
              <span style={{background:shade+(themeMode==="light"?"12":"18"),color:shade,padding:"3px 10px",borderRadius:P.btnStyle.borderRadius,fontSize:10,fontFamily:P.bodyFont,fontWeight:600}}>{taskDone}/{taskTotal}</span>
            </div>
            {/* Focus filter pills — attackers only */}
            {tk === "attackers" && sub.tasks.length > 0 && (
              <div style={{marginBottom:12,padding:10,background:T.surface,borderRadius:6,border:`1px solid ${T.border}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <span style={{fontFamily:P.font,...P.labelStyle,fontSize:8,color:T.textMut,letterSpacing:2}}>🎯 FOCUS TARGETS — HOME PRIORITY</span>
                  {((state.focusedTasks||{})[sub.id]||[]).length > 0 && (
                    <button onClick={()=>clearFocusedTasks(sub.id)} style={{background:"transparent",border:`1px solid ${T.border}`,color:T.textMut,cursor:"pointer",fontSize:7,padding:"2px 8px",borderRadius:4,fontFamily:P_ALL.coach.font,letterSpacing:1}}>CLEAR ALL</button>
                  )}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {sub.tasks.map(task => {
                    const isFocused = ((state.focusedTasks||{})[sub.id]||[]).includes(task.id);
                    const tDone = task.done;
                    const childCount = countAllTasks(task.children || []);
                    const childDoneCount = countDoneTasks(task.children || []);
                    return (
                      <button key={task.id} onClick={()=>toggleFocusedTask(sub.id, task.id)} style={{
                        display:"flex",alignItems:"center",gap:5,
                        background: isFocused ? shade : T.cardBg,
                        border: `2px solid ${isFocused ? shade : T.borderStr}`,
                        borderRadius:16,padding:"5px 12px 5px 8px",cursor:"pointer",
                        transition:"all 0.2s",opacity:tDone?0.5:1,
                      }}>
                        <div style={{
                          width:8,height:8,borderRadius:"50%",flexShrink:0,
                          background:isFocused?"rgba(255,255,255,0.8)":tDone?T.ok:shade,
                        }} />
                        <span style={{
                          fontFamily:P.bodyFont,fontSize:10,fontWeight:600,letterSpacing:0.3,
                          color:isFocused?"#fff":T.text,maxWidth:120,overflow:"hidden",
                          textOverflow:"ellipsis",whiteSpace:"nowrap",
                          textDecoration:tDone?"line-through":"none",
                        }}>
                          {task.text}
                        </span>
                        {childCount > 0 && (
                          <span style={{
                            background:isFocused?"rgba(255,255,255,0.25)":shade+"18",
                            color:isFocused?"#fff":shade,
                            padding:"0px 5px",borderRadius:8,fontSize:8,fontWeight:700,
                            fontFamily:P_ALL.coach.font,
                          }}>
                            {childDoneCount}/{childCount}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>
                {((state.focusedTasks||{})[sub.id]||[]).length > 0 && (
                  <div style={{fontFamily:P_ALL.coach.font,fontSize:7,color:T.textMut,letterSpacing:2,marginTop:6,opacity:0.6}}>
                    {((state.focusedTasks||{})[sub.id]||[]).length} OF {sub.tasks.length} TARGETS FOCUSED FOR HOME
                  </div>
                )}
              </div>
            )}
            {/* Task rendering: recursive for attackers, flat for others */}
            {tk === "attackers" ? (
              sub.tasks.map(task => renderAttackerTask(task, 0))
            ) : (
              sub.tasks.map(task => (
              <div key={task.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:`1px solid ${T.border}`}}>
                {task.isSleepTracker?(
                  <div style={{display:"flex",alignItems:"center",gap:8,flex:1,flexWrap:"wrap"}}>
                    <span style={{fontFamily:P.bodyFont,...P.taskStyle,opacity:task.done?0.35:1,color:T.text,textDecoration:task.done?"line-through":"none",flex:1}}>{tk==="defenders"?"🔒":"🌙"} {task.text} {task.sleepHours?`(${task.sleepHours}H)`:""}</span>
                    {!task.done?(<div style={{display:"flex",gap:4,alignItems:"center"}}>
                      <input type="number" placeholder="HRS" value={sleepHours} onChange={e=>setSleepHours(e.target.value)} style={{...inp(tk),width:55,padding:"5px 8px",textAlign:"center"}} min="0" max="24" step="0.5"/>
                      <button style={btn(tk,shade)} onClick={()=>{if(sleepHours){completeTask(tk,sub.id,task.id,sleepHours);setSleepHours("");}}}>{tk==="defenders"?"LOCK":"LOG"}</button>
                    </div>):(<button style={{...btn(tk,"transparent"),opacity:0.4,fontSize:9,color:T.textSec}} onClick={()=>completeTask(tk,sub.id,task.id)}>UNDO</button>)}
                  </div>
                ):(
                  <>
                    <div onClick={()=>completeTask(tk,sub.id,task.id)} style={{width:22,height:22,borderRadius:P.checkRadius,border:`2px solid ${task.done?shade:T.chkOff}`,background:task.done?shade:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      {task.done&&<span style={{color:"#fff",fontSize:11,fontWeight:700}}>{tk==="defenders"?"🔒":"✓"}</span>}
                    </div>
                    <span style={{fontFamily:P.bodyFont,...P.taskStyle,opacity:task.done?0.3:1,color:T.text,textDecoration:task.done?"line-through":"none",flex:1}}>{task.text}</span>
                    {task.recurring&&<span style={{fontFamily:P.bodyFont,...P.labelStyle,fontSize:8,color:T.textMut}}>{tk==="attackers"?"REPEAT":"DAILY"}</span>}
                    <button onClick={()=>removeTask(tk,sub.id,task.id)} style={{background:"transparent",border:"none",color:T.rmBtn,cursor:"pointer",fontSize:16,padding:"0 4px"}}>×</button>
                  </>
                )}
              </div>
              ))
            )}
            {showAddTask===sub.id?(
              <div style={{marginTop:10,display:"flex",gap:8,alignItems:"center"}}>
                <input style={{...inp(tk),flex:1}} placeholder={tk==="defenders"?"NEW PROTOCOL...":tk==="attackers"?"NEW TARGET...":"New task..."} value={newTaskText} onChange={e=>setNewTaskText(e.target.value)} autoFocus onKeyDown={e=>{if(e.key==="Enter"&&newTaskText.trim()){addTask(tk,sub.id,newTaskText.trim());setNewTaskText("");setShowAddTask(false);}}}/>
                <button style={btn(tk,shade)} onClick={()=>{if(newTaskText.trim()){addTask(tk,sub.id,newTaskText.trim());setNewTaskText("");setShowAddTask(false);}}}>
                  {tk==="defenders"?"SECURE":tk==="attackers"?"DEPLOY":"ADD"}</button>
                <button style={{...btn(tk,"transparent"),color:T.textSec}} onClick={()=>{setShowAddTask(false);setNewTaskText("");}}>✕</button>
              </div>
            ):(
              <button style={{background:"transparent",border:`1px dashed ${shade}${themeMode==="light"?"35":"25"}`,color:shade,padding:8,cursor:"pointer",width:"100%",marginTop:10,fontFamily:P.font,...P.btnStyle}} onClick={()=>{setShowAddTask(sub.id);setNewTaskText("");}}>
                + {tk==="defenders"?"ADD PROTOCOL":tk==="attackers"?"ADD TARGET":"ADD TASK"}</button>
            )}
            {tk==="attackers"&&(<div style={{marginTop:12}}>
              <div style={{fontFamily:P.font,...P.labelStyle,color:T.textMut,marginBottom:8}}>QUICK LINKS</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {(sub.links||[]).map((link,li)=>(<a key={li} href={link.url} target="_blank" rel="noopener noreferrer" style={{background:shade+(themeMode==="light"?"10":"12"),border:`2px solid ${shade}${themeMode==="light"?"20":"25"}`,color:shade,padding:"5px 12px",borderRadius:P.btnStyle.borderRadius,fontSize:10,textDecoration:"none",fontFamily:P.font,letterSpacing:2}}>⚡ {link.title}</a>))}
              </div>
              {showAddLink===sub.id?(
                <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
                  <input style={{...inp(tk),flex:1,minWidth:80}} placeholder="TITLE" value={newLinkTitle} onChange={e=>setNewLinkTitle(e.target.value)} autoFocus/>
                  <input style={{...inp(tk),flex:2,minWidth:120}} placeholder="URL" value={newLinkUrl} onChange={e=>setNewLinkUrl(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&newLinkTitle.trim()&&newLinkUrl.trim()){addLink(sub.id,newLinkTitle.trim(),newLinkUrl.trim());setNewLinkTitle("");setNewLinkUrl("");setShowAddLink(false);}}}/>
                  <button style={btn(tk,shade)} onClick={()=>{if(newLinkTitle.trim()&&newLinkUrl.trim()){addLink(sub.id,newLinkTitle.trim(),newLinkUrl.trim());setNewLinkTitle("");setNewLinkUrl("");setShowAddLink(false);}}}>DEPLOY</button>
                  <button style={{...btn(tk,"transparent"),color:T.textSec}} onClick={()=>setShowAddLink(false)}>✕</button>
                </div>
              ):(<button style={{background:"transparent",border:"none",color:shade,cursor:"pointer",fontSize:10,fontFamily:P.font,marginTop:6,opacity:0.5,letterSpacing:2,padding:0}} onClick={()=>{setShowAddLink(sub.id);setNewLinkTitle("");setNewLinkUrl("");}}>+ ADD LINK</button>)}
            </div>)}
          </div>);
        })}
      </div>
    );
  };

  /* ─── COACH ─── */
  const renderCoach = () => {
    const P=P_ALL.coach;const C=TC("coach");
    return (
      <div style={{padding:16,maxWidth:620,margin:"0 auto",fontFamily:P.font}}>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:P.cardRadius,padding:20,marginBottom:20,boxShadow:T.shadow}}>
          <div style={{...P.labelStyle,color:T.textMut,marginBottom:6}}>CONTROL CENTER</div>
          <div style={{...P.titleStyle,fontSize:24,color:C.base}}>📋 COACH DASHBOARD</div>
          <div style={{fontFamily:P.bodyFont,fontSize:12,color:T.textMut,letterSpacing:2,marginTop:4}}>{P.tagline}</div>
        </div>

        {/* Football Field */}
        {renderField()}

        {/* Theme Selector */}
        <div style={{background:T.cardBg,borderRadius:P.cardRadius,padding:16,marginBottom:14,border:`1px solid ${T.border}`,boxShadow:T.shadow}}>
          <div style={{...P.labelStyle,color:T.textMut,marginBottom:14}}>🎨 THEME SELECTOR</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            <button onClick={()=>setState(p=>({...p,themeId:"auto"}))} style={{
              background:state.themeId==="auto"?TC("coach").base:T.surface,
              border:`${state.themeId==="auto"?2:1}px solid ${state.themeId==="auto"?TC("coach").base:T.borderStr}`,
              color:state.themeId==="auto"?"#fff":T.text,padding:"10px 14px",borderRadius:6,cursor:"pointer",textAlign:"left",
            }}>
              <div style={{fontSize:14,marginBottom:2}}>🔄</div>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:1}}>AUTO</div>
              <div style={{fontSize:8,opacity:0.6,letterSpacing:1}}>Day/Night</div>
            </button>
            {THEME_LIST.map(t => (
              <button key={t.id} onClick={()=>setState(p=>({...p,themeId:t.id}))} style={{
                background:state.themeId===t.id?TC("coach").base:T.surface,
                border:`${state.themeId===t.id?2:1}px solid ${state.themeId===t.id?TC("coach").base:T.borderStr}`,
                color:state.themeId===t.id?"#fff":T.text,padding:"10px 14px",borderRadius:6,cursor:"pointer",textAlign:"left",
              }}>
                <div style={{fontSize:14,marginBottom:2}}>{t.icon}</div>
                <div style={{fontSize:11,fontWeight:700,letterSpacing:1}}>{t.name.toUpperCase()}</div>
                <div style={{fontSize:8,opacity:0.6,letterSpacing:1}}>{t.desc}</div>
              </button>
            ))}
          </div>
        </div>

        {/* Font Selector */}
        <div style={{background:T.cardBg,borderRadius:P.cardRadius,padding:16,marginBottom:14,border:`1px solid ${T.border}`,boxShadow:T.shadow}}>
          <div style={{...P.labelStyle,color:T.textMut,marginBottom:14}}>🔤 TEAM IDENTITY — FONT CONTROL</div>
          {["attackers","midPlayers","defenders","coach"].map(tk => {
            const opts=FONT_OPTIONS[tk];const currentId=state.fonts[tk];const teamC=TC(tk);
            return (<div key={tk} style={{marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{fontSize:16}}>{getTeamIcon(tk)}</span>
                <span style={{fontFamily:P_ALL[tk].font,color:teamC.base,fontSize:12,fontWeight:700,letterSpacing:2}}>{P_ALL[tk].nameDisplay}</span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {opts.map(opt => (<button key={opt.id} onClick={()=>setState(p=>({...p,fonts:{...p.fonts,[tk]:opt.id}}))} style={{
                  background:currentId===opt.id?teamC.base:T.surface,border:`${currentId===opt.id?2:1}px solid ${currentId===opt.id?teamC.base:T.borderStr}`,
                  color:currentId===opt.id?"#fff":T.text,padding:"8px 14px",borderRadius:6,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"flex-start",gap:2,
                }}>
                  <span style={{fontFamily:opt.family,fontSize:13,fontWeight:700,letterSpacing:1}}>{opt.name}</span>
                  <span style={{fontSize:9,opacity:currentId===opt.id?0.8:0.45,letterSpacing:1,fontFamily:P.font}}>{opt.vibe}</span>
                </button>))}
              </div>
              <div style={{marginTop:8,background:T.surface,borderRadius:4,padding:"8px 12px",border:`1px solid ${T.border}`}}>
                <span style={{fontFamily:getFont(tk,currentId),fontSize:14,color:teamC.base,letterSpacing:2}}>
                  {P_ALL[tk].tagline}
                </span>
              </div>
            </div>);
          })}
        </div>

        {/* Settings sections */}
        {[{label:"WEEKDAY MINIMUMS",key:"weekdayMinimums",note:"FLUID"},{label:"WEEKEND MINIMUMS",key:"weekendMinimums",note:"⚠️ STRICT"}].map(sec=>(
          <div key={sec.key} style={{background:T.cardBg,borderRadius:P.cardRadius,padding:14,marginBottom:14,border:`1px solid ${T.border}`,boxShadow:T.shadow}}>
            <div style={{...P.labelStyle,color:T.textMut,marginBottom:12}}>{sec.label} — {sec.note}</div>
            {["attackers","midPlayers","defenders"].map(tk=>(<div key={tk} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.border}`}}>
              <span style={{color:TC(tk).base,fontSize:12,fontFamily:P_ALL[tk].font}}>{getTeamIcon(tk)} {P_ALL[tk].nameDisplay}</span>
              <input type="number" value={state.coach[sec.key][tk]} onChange={e=>updateCoach(`${sec.key}.${tk}`,e.target.value)} style={{...inp("coach"),width:50,textAlign:"center",padding:"4px"}} min="0"/>
            </div>))}
          </div>
        ))}
        <div style={{background:T.cardBg,borderRadius:P.cardRadius,padding:14,marginBottom:14,border:`1px solid ${T.border}`,boxShadow:T.shadow}}>
          <div style={{...P.labelStyle,color:T.textMut,marginBottom:12}}>PUNISHMENT PARAMETERS</div>
          {[{label:"PUNISHMENT DURATION (HRS)",key:"punishmentDuration"},{label:"COOLDOWN PERIOD (HRS)",key:"cooldownHours"},{label:"OVERRIDE PENALTY (PTS)",key:"overridePenalty"},{label:"IGNORED DAYS TRIGGER",key:"ignoredDaysTrigger"},{label:"DAILY IGNORE PENALTY",key:"dailyIgnorePenalty"}].map(item=>(
            <div key={item.key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.border}`}}>
              <span style={{fontSize:11,color:T.textSec}}>{item.label}</span>
              <input type="number" value={state.coach[item.key]} onChange={e=>updateCoach(item.key,e.target.value)} style={{...inp("coach"),width:55,textAlign:"center",padding:"4px"}} min="0"/>
            </div>
          ))}
        </div>
        <div style={{background:T.cardBg,borderRadius:P.cardRadius,padding:14,marginBottom:14,border:`1px solid ${T.border}`,boxShadow:T.shadow}}>
          <div style={{...P.labelStyle,color:T.textMut,marginBottom:12}}>CREDIT STATUS</div>
          {["attackers","midPlayers","defenders"].map(tk=>{const pct=Math.min(100,(state.credits[tk]/150)*100);return(
            <div key={tk} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{color:TC(tk).base,fontSize:12,fontFamily:P_ALL[tk].font}}>{getTeamIcon(tk)} {P_ALL[tk].nameDisplay}</span>
                <span style={{fontSize:13,fontWeight:700,color:TC(tk).base}}>{state.credits[tk]}</span>
              </div>
              <div style={{background:T.barBg,borderRadius:3,height:6,overflow:"hidden"}}>
                <div style={{background:TC(tk).base,height:"100%",width:`${pct}%`,borderRadius:3,transition:"width 0.5s"}}/>
              </div>
            </div>);})}
          <div style={{fontSize:9,color:T.textMut,marginTop:8,letterSpacing:1}}>MONTHLY RESET: 1ST — BELOW 100 → RESET | ABOVE 100 → KEPT</div>
        </div>

        {/* TAG MANAGEMENT */}
        <div style={{background:T.cardBg,borderRadius:P.cardRadius,padding:14,marginBottom:14,border:`1px solid ${T.border}`,boxShadow:T.shadow}}>
          <div style={{...P.labelStyle,color:T.textMut,marginBottom:12}}>🏷️ AUTO-TAG RULES [{(state.tags||[]).length}]</div>
          <div style={{fontSize:9,color:T.textSec,marginBottom:12,letterSpacing:0.5}}>TAGS AUTO-ASSIGN WHEN TASK TEXT MATCHES KEYWORDS. CLICK A TAG TO EDIT.</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {(state.tags||[]).map(tag => {
              const isEditing = editingTag === tag.id;
              return (
                <div key={tag.id} style={{background:T.surface,borderRadius:6,border:`1px solid ${tag.color}25`,borderLeft:`3px solid ${tag.color}`,padding:isEditing?"10px":"8px 10px"}}>
                  {isEditing ? (
                    <div style={{display:"flex",flexDirection:"column",gap:6}}>
                      <div style={{display:"flex",gap:6,alignItems:"center"}}>
                        <input style={{...inp("coach"),flex:1,fontSize:10,padding:"4px 8px"}} value={tag.name} onChange={e=>updateTag(tag.id,"name",e.target.value)} />
                        <input type="color" value={tag.color} onChange={e=>updateTag(tag.id,"color",e.target.value)} style={{width:28,height:28,border:"none",padding:0,cursor:"pointer",borderRadius:4}} />
                      </div>
                      <div style={{display:"flex",gap:6,alignItems:"center"}}>
                        <input style={{...inp("coach"),flex:1,fontSize:9,padding:"4px 8px"}} value={(tag.keywords||[]).join(", ")} onChange={e=>updateTag(tag.id,"keywords",e.target.value)} placeholder="keyword1, keyword2, ..." />
                      </div>
                      <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                        <button onClick={()=>removeTag(tag.id)} style={{background:"transparent",border:`1px solid ${T.lockBrd}`,color:T.lockBrd,padding:"3px 10px",borderRadius:4,fontSize:8,cursor:"pointer",fontFamily:P.font}}>DELETE</button>
                        <button onClick={()=>setEditingTag(null)} style={{...btn("coach",TC("coach").base),padding:"3px 12px",fontSize:8}}>DONE</button>
                      </div>
                    </div>
                  ) : (
                    <div onClick={()=>setEditingTag(tag.id)} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                      <span style={{
                        background:tag.color+"20",border:`1.5px solid ${tag.color}60`,
                        color:tag.color,padding:"2px 8px",borderRadius:10,
                        fontSize:8,fontFamily:P.font,fontWeight:700,letterSpacing:1,flexShrink:0,
                      }}>{tag.name}</span>
                      <span style={{fontSize:8,color:T.textMut,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontFamily:P.bodyFont}}>
                        {(tag.keywords||[]).join(", ")}
                      </span>
                      <span style={{fontSize:8,color:T.textMut,opacity:0.4}}>✏️</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {/* Add new tag */}
          <div style={{marginTop:10,padding:10,background:T.surface,borderRadius:6,border:`1px dashed ${T.borderStr}`}}>
            <div style={{fontSize:8,color:T.textMut,letterSpacing:2,marginBottom:6,fontFamily:P.font}}>+ NEW TAG</div>
            <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
              <input style={{...inp("coach"),width:80,fontSize:10,padding:"4px 8px"}} placeholder="NAME" value={newTagName} onChange={e=>setNewTagName(e.target.value)} />
              <input type="color" value={newTagColor} onChange={e=>setNewTagColor(e.target.value)} style={{width:28,height:28,border:"none",padding:0,cursor:"pointer",borderRadius:4}} />
              <input style={{...inp("coach"),flex:1,minWidth:100,fontSize:9,padding:"4px 8px"}} placeholder="keyword1, keyword2, ..." value={newTagKeywords} onChange={e=>setNewTagKeywords(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&newTagName.trim()){addTag(newTagName.trim(),newTagColor,newTagKeywords);setNewTagName("");setNewTagKeywords("");}}} />
              <button style={{...btn("coach",TC("coach").base),padding:"4px 12px",fontSize:9}} onClick={()=>{if(newTagName.trim()){addTag(newTagName.trim(),newTagColor,newTagKeywords);setNewTagName("");setNewTagKeywords("");}}}>ADD</button>
            </div>
          </div>
        </div>

        <div style={{background:T.cardBg,borderRadius:P.cardRadius,padding:14,marginBottom:14,border:`1px solid ${T.border}`,boxShadow:T.shadow}}>
          <div style={{...P.labelStyle,color:T.textMut,marginBottom:12}}>SESSION LOGS [{state.coachSessions.length}]</div>
          {state.coachSessions.length===0?(<div style={{fontSize:11,color:T.textMut,textAlign:"center",padding:20}}>NO SESSIONS. SQUAD IS BEHAVING.</div>):(
            state.coachSessions.slice(-5).reverse().map(sess=>(<div key={sess.id} style={{background:T.surface,borderRadius:6,padding:12,marginBottom:8,borderLeft:`3px solid ${T.sessBrd}`}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <span style={{fontSize:10,color:T.lockBrd}}>TRIGGER: {getTeamLabel(sess.triggeredBy)}</span>
                <span style={{fontSize:10,color:T.textMut}}>{new Date(sess.date).toLocaleDateString()}</span>
              </div>
              {Object.entries(sess.answers).map(([qi,ans])=>(<div key={qi} style={{marginBottom:6}}>
                <div style={{fontSize:9,color:T.textMut,marginBottom:2}}>Q{parseInt(qi)+1}: {COACH_QUESTIONS[parseInt(qi)]}</div>
                <div style={{fontSize:11,color:T.textSec,paddingLeft:8}}>→ {ans}</div>
              </div>))}
            </div>))
          )}
        </div>
        <button style={{...btn("coach",TC("coach").base),width:"100%",padding:14}} onClick={()=>setShowCoachSession(true)}>📋 START MANUAL SESSION</button>
      </div>
    );
  };

  const renderModal = () => (
    <div style={{position:"fixed",inset:0,background:T.modalOv,zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:T.modalBg,border:`2px solid ${TC("coach").base}`,borderRadius:8,padding:24,maxWidth:520,width:"100%",maxHeight:"90vh",overflow:"auto",fontFamily:P_ALL.coach.font,color:T.text,boxShadow:T.shadowStr||T.shadow}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:32,marginBottom:8}}>📋</div>
          <div style={{fontSize:18,fontWeight:700,color:TC("coach").base,letterSpacing:4}}>COACH SESSION</div>
          <div style={{fontSize:12,color:T.textMut,marginTop:6,letterSpacing:2}}>ALL RESPONSES RECORDED FOR ANALYSIS.</div>
        </div>
        {COACH_QUESTIONS.map((q,i)=>(<div key={i} style={{marginBottom:18}}>
          <div style={{fontSize:12,color:TC("coach").base,marginBottom:6,fontWeight:700,letterSpacing:1}}>Q{i+1}: {q}</div>
          <textarea style={{...inp("coach"),minHeight:60,resize:"vertical"}} placeholder="YOUR ANSWER..." value={sessionAnswers[i]||""} onChange={e=>setSessionAnswers(p=>({...p,[i]:e.target.value}))}/>
        </div>))}
        <div style={{display:"flex",gap:10,marginTop:20}}>
          <button style={{...btn("coach",T.surface),flex:1,padding:12,color:T.textSec}} onClick={()=>{setShowCoachSession(false);setSessionAnswers({});}}>CANCEL</button>
          <button style={{...btn("coach",TC("coach").base),flex:1,padding:12,opacity:Object.keys(sessionAnswers).length<COACH_QUESTIONS.length?0.4:1}} onClick={submitCoachSession} disabled={Object.keys(sessionAnswers).length<COACH_QUESTIONS.length}>SUBMIT</button>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{background:T.bg,color:T.text,minHeight:"100vh",transition:"background 0.4s,color 0.4s"}}>
      <style>{FONTS_CSS}{`*{box-sizing:border-box;margin:0;padding:0}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:${T.border};border-radius:4px}textarea{font-family:inherit}input[type=number]::-webkit-inner-spin-button{opacity:0.3}a:hover{opacity:0.8}`}</style>
      <div style={{background:T.topBar,borderBottom:`1px solid ${T.border}`,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(20px)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>{setView("dashboard");setSelectedTeam(null);}}>
          <span style={{fontSize:20}}>⚽</span>
          <span style={{fontFamily:P_ALL.coach.font,fontSize:14,fontWeight:700,letterSpacing:3,color:T.text}}>SQUAD</span>
        </div>
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <button onClick={()=>{setView("dashboard");setSelectedTeam(null);}} style={{background:view==="dashboard"?T.navAct:"transparent",border:`1px solid ${view==="dashboard"?T.borderStr:"transparent"}`,color:view==="dashboard"?T.navActTxt:T.navTxt,padding:"5px 10px",borderRadius:6,cursor:"pointer",fontFamily:P_ALL.coach.font,fontSize:10,letterSpacing:2}}>HOME</button>
          {view==="dashboard" && (
            <button onClick={()=>{setHomeMode(homeMode==="chat"?"dashboard":"chat");setChatMessages([]);setChatStep(null);}} style={{
              background:homeMode==="chat"?TC("coach").base+"20":"transparent",
              border:`1px solid ${homeMode==="chat"?TC("coach").base+"50":"transparent"}`,
              color:homeMode==="chat"?TC("coach").base:T.navTxt,
              padding:"5px 8px",borderRadius:6,cursor:"pointer",fontSize:12,
            }} title={homeMode==="chat"?"Switch to Dashboard":"Switch to Chat"}>{homeMode==="chat"?"💬":"📊"}</button>
          )}
          {["attackers","midPlayers","defenders"].map(tk=>(<button key={tk} onClick={()=>{setView("team");setSelectedTeam(tk);}} style={{background:(view==="team"&&selectedTeam===tk)?TC(tk).lighter:"transparent",border:`1px solid ${(view==="team"&&selectedTeam===tk)?TC(tk).border:"transparent"}`,color:(view==="team"&&selectedTeam===tk)?TC(tk).base:T.navTxt,padding:"5px 8px",borderRadius:6,cursor:"pointer",fontSize:14}}>{getTeamIcon(tk)}</button>))}
          <button onClick={()=>setView("coach")} style={{background:view==="coach"?TC("coach").lighter:"transparent",border:`1px solid ${view==="coach"?TC("coach").border:"transparent"}`,color:view==="coach"?TC("coach").base:T.navTxt,padding:"5px 8px",borderRadius:6,cursor:"pointer",fontSize:14}}>📋</button>
        </div>
      </div>
      {view==="dashboard"&&(homeMode==="chat"?renderChat():renderDash())}
      {view==="team"&&renderTeam()}
      {view==="coach"&&renderCoach()}
      {showCoachSession&&renderModal()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(TeamTaskManager));
  </script>
</body>
</html>
